<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُنسق وقاصّ البطاقات الذكي</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --accent: #f5b400;
            --cs-green: #16a34a;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 65px;
            touch-action: pan-y;
            overflow-x: hidden;
        }

        body.dragging-slot-active {
            touch-action: none;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .upload-section {
            display: block;
            background: linear-gradient(135deg, #f5b400, #d97706);
            color: #000;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(245, 180, 0, 0.3);
        }

        .upload-section input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            z-index: -1;
        }

        .global-control-bar {
            max-width: 794px;
            margin: 0 auto 15px auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .btn-g-action {
            padding: 10px 8px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            font-size: 0.78rem;
            cursor: pointer;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.3);
        }

        .btn-g-copy { background: #9333ea; }
        .btn-g-paste { background: #4b5563; opacity: 0.85; }
        .btn-g-paste.ready { background: #16a34a; opacity: 1; }
        .btn-g-enhance { background: #0d9488; }
        .btn-g-enhance.busy { opacity: 0.7; pointer-events: none; }
        .btn-g-save { background: #2563eb; grid-column: span 3; }

        .move-mode-banner {
            display: none;
            max-width: 794px;
            margin: 0 auto 12px auto;
            background: #14532d;
            border: 1.5px solid #22c55e;
            color: #dcfce7;
            padding: 9px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .move-mode-banner.active {
            display: flex;
        }

        .move-cancel-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* شاشة الاقتصاص */
        #cropperModal {
            display: none;
            position: fixed;
            inset: 0;
            background: #e5e7eb;
            color: #111827;
            z-index: 9999;
            flex-direction: column;
            justify-content: space-between;
            touch-action: none;
        }

        .cs-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            z-index: 10;
        }

        .cs-btn-close {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 1.35rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cs-top-title {
            font-size: 1rem;
            font-weight: 700;
            color: #111827;
        }

        .cs-btn-check {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            color: #111827;
            font-size: 1.45rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cs-edge-switcher {
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: #f9fafb;
            border-bottom: 1px solid #e5e7eb;
            z-index: 10;
        }

        .cs-edge-btn {
            flex: 1;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1.5px solid #d1d5db;
            background: #ffffff;
            color: #1f2937;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }

        .cs-edge-btn.active {
            background: #16a34a;
            border-color: #16a34a;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(22, 163, 74, 0.28);
        }

        .cs-workspace {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #e5e7eb;
            touch-action: none;
        }

        #cropCanvas {
            display: block;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        .cs-processing-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: 25;
            justify-content: center;
            align-items: center;
        }

        .cs-logo-badge {
            width: 58px;
            height: 58px;
            border-radius: 14px;
            background: #16a34a;
            color: #ffffff;
            font-weight: 900;
            font-size: 1.55rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            letter-spacing: -1px;
        }

        #csResultPreview {
            display: none;
            position: absolute;
            inset: 0;
            background: #ffffff;
            z-index: 30;
            flex-direction: column;
            justify-content: space-between;
            touch-action: pan-y;
        }

        .cs-res-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f3f4f6;
        }

        .cs-res-done {
            background: #16a34a;
            color: #ffffff;
            border: none;
            padding: 7px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
        }

        .cs-res-body {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #ffffff;
        }

        .cs-res-body img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .cs-res-bottom {
            padding: 12px 16px 18px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #ffffff;
            border-top: 1px solid #f3f4f6;
        }

        .cs-res-action {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #111827;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        .cs-bottom-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            background: #ffffff;
            padding: 10px 8px 16px;
            border-top: 1px solid #e5e7eb;
            z-index: 10;
        }

        .cs-tool-btn {
            background: none;
            border: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: #111827;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
        }

        .cs-tool-btn.active-tool {
            color: #16a34a;
            font-weight: 700;
        }

        .cs-icon-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            line-height: 1;
        }

        .cs-red-dot {
            position: absolute;
            top: -2px;
            right: -5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ef4444;
        }

        /* تنسيق أوراق الطباعة A4 */
        .page-wrapper { margin-bottom: 25px; }

        .page-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 10px 10px 0 0;
            border: 1px solid #333;
            border-bottom: none;
        }

        .page-toolbar span {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .toolbar-btns { display: flex; gap: 6px; }

        .tool-btn {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-save { background: #2563eb; }
        .btn-wa { background: #16a34a; }
        .btn-pdf { background: #dc2626; }
        .btn-clear-all {
            background: #dc2626;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .a4-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 794px;
            margin: 0 auto;
            padding: 6px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .id-pair-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 100%;
        }

        .id-box {
            width: 100%;
            aspect-ratio: 1.586 / 1;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
            touch-action: pan-y;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
        }

        .id-box.has-img { border: 1px solid #e2e8f0; }
        .id-box.pinching-active,
        .id-box.nudging-active { touch-action: none; }

        .id-box.moving-selected {
            border: 3px solid #16a34a !important;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.35), 0 8px 18px rgba(0, 0, 0, 0.25);
            transform: scale(0.98);
        }

        .id-box.moving-selected::after {
            content: "⇄ جاهز للنقل";
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: #16a34a;
            color: #ffffff;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 6;
            pointer-events: none;
        }

        .id-box.move-target-hint {
            border: 2px dashed #16a34a;
            background: #f0fdf4;
        }

        .id-box.drag-source {
            opacity: 0.45;
            border: 2px dashed #16a34a;
        }

        .id-box.drag-target-over {
            border: 2.5px solid #16a34a !important;
            box-shadow: inset 0 0 0 2px rgba(22, 163, 74, 0.35), 0 0 12px rgba(22, 163, 74, 0.45);
            background: #f0fdf4;
        }

        .id-box .slot-stage {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .id-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            display: block;
            transform-origin: center center;
            will-change: transform;
            pointer-events: none;
        }

        .box-btn-del {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 22px;
            height: 22px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .box-btn-replace {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background: rgba(22, 163, 74, 0.9);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        #touchDragGhost {
            display: none;
            position: fixed;
            width: 132px;
            aspect-ratio: 1.586 / 1;
            border-radius: 6px;
            overflow: hidden;
            background: #ffffff;
            border: 2.5px solid #16a34a;
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
            z-index: 10000;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(1.06);
        }

        #touchDragGhost img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #ffffff;
            display: block;
        }

        @media print {
            body { background: white; padding: 0; }
            header, .upload-section, .global-control-bar, .move-mode-banner, .page-toolbar, #cropperModal, #touchDragGhost, .btn-clear-all, .box-btn-del, .box-btn-replace { display: none !important; }
            .page-wrapper { margin: 0; page-break-after: always; }
            .a4-sheet { box-shadow: none; width: 210mm; height: 297mm; padding: 5mm; gap: 4mm; }
        }
    </style>
</head>
<body>

    <header>
        <h1>مُنسق وقاصّ البطاقات الذكي</h1>
        <p>تحريك هادئ داخل الإطار لجلب الأجزاء المفقودة + تكتين للنقل وتكّة للوضع أو التبديل</p>
    </header>

    <label class="upload-section" for="galleryInput">
        🖼️ اختيار صور البطاقات / العقود من المعرض
        <input type="file" id="galleryInput" accept="image/*" multiple onclick="this.value=null">
    </label>

    <div class="global-control-bar">
        <button class="btn-g-action btn-g-copy" id="globalCopyBtn" onclick="globalCopyFormat()">🎨 نسخ التنسيق</button>
        <button class="btn-g-action btn-g-paste" id="globalPasteBtn" onclick="globalPasteFormat()">📌 لصق التنسيق</button>
        <button class="btn-g-action btn-g-enhance" id="globalEnhanceBtn" onclick="globalEnhanceAllCards()">✨ تحسين</button>
        <button class="btn-g-action btn-g-save" onclick="manualSaveWork()">💾 حفظ العمل يدوياً</button>
    </div>

    <div class="move-mode-banner" id="moveModeBanner">
        <span>⇄ وضع النقل نشط: اضغط تكّة واحدة على أي خانة (فاضية أو عليها صورة) للنقل أو التبديل.</span>
        <button type="button" class="move-cancel-btn" onclick="cancelPendingMove()">إلغاء</button>
    </div>

    <div id="sheetsContainer"></div>
    <div id="clearSection" style="max-width: 794px; margin: 0 auto;"></div>

    <div id="touchDragGhost"><img id="touchDragGhostImg" src="" alt=""></div>

    <!-- شاشة الاقتصاص -->
    <div id="cropperModal">
        <div class="cs-top-bar">
            <button class="cs-btn-close" onclick="closeCropper()" title="إلغاء">✕</button>
            <span class="cs-top-title">الاقتصاص</span>
            <button class="cs-btn-check" onclick="confirmCropAndPreview()" title="تأكيد">✓</button>
        </div>

        <div class="cs-edge-switcher">
            <button type="button" class="cs-edge-btn" id="btnContractEdges" onclick="detectContractEdges()">
                📄 حواف العقد
            </button>
            <button type="button" class="cs-edge-btn active" id="btnCardEdges" onclick="detectCardEdgesOnly()">
                🪪 حواف البطاقة
            </button>
        </div>

        <div class="cs-workspace" id="workspaceArea">
            <canvas id="cropCanvas"></canvas>

            <div class="cs-processing-overlay" id="csProcessing">
                <div class="cs-logo-badge">CS</div>
            </div>

            <div id="csResultPreview">
                <div class="cs-res-top">
                    <button class="cs-btn-close" onclick="backToCropBox()" title="رجوع">✕</button>
                    <button class="cs-res-done" onclick="finalizeResultToSheet()">تم</button>
                </div>
                <div class="cs-res-body">
                    <img id="csPreviewImg" src="" alt="معاينة البطاقة">
                </div>
                <div class="cs-res-bottom">
                    <button class="cs-res-action" onclick="backToCropBox()">
                        <span style="font-size:1.2rem">✂️</span>
                        <span>تعديل الإطار</span>
                    </button>
                    <button class="cs-res-action" onclick="togglePreviewEnhance()">
                        <span style="font-size:1.2rem">✨</span>
                        <span id="enhanceLabel">وضع: تحسين</span>
                    </button>
                    <button class="cs-res-action" onclick="finalizeResultToSheet()">
                        <span style="font-size:1.2rem">📥</span>
                        <span>إضافة للورقة</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="cs-bottom-bar" id="csBottomBar">
            <button class="cs-tool-btn" id="btnAll" onclick="selectFullImageQuad()">
                <span class="cs-icon-wrap">⛶</span>
                <span>الكل</span>
            </button>
            <button class="cs-tool-btn active-tool" id="btnAuto" onclick="detectCardEdgesOnly()">
                <span class="cs-icon-wrap">⚡<span class="cs-red-dot"></span></span>
                <span>القص التلقائي</span>
            </button>
            <button class="cs-tool-btn" id="btnRight" onclick="rotate90(90)">
                <span class="cs-icon-wrap">↻</span>
                <span>الأيمن</span>
            </button>
            <button class="cs-tool-btn" id="btnLeft" onclick="rotate90(-90)">
                <span class="cs-icon-wrap">↺</span>
                <span>اليسار</span>
            </button>
        </div>
    </div>

    <input type="file" id="replaceInput" accept="image/*" style="display:none" onchange="handleReplaceFile(this)">

    <script>
        const FULL_QUAD = {
            tl: { x: 0, y: 0 },
            tr: { x: 1, y: 0 },
            br: { x: 1, y: 1 },
            bl: { x: 0, y: 1 }
        };
        const STORAGE_KEY = 'pro_id_cards_v58';

        let cardsData = [];
        let activeRowIndex = -1;
        let activeSide = 'front';
        let replaceTargetIndex = -1;
        let replaceTargetSide = null;

        let copiedFormat = null;
        let selectedSlots = new Set();

        let pendingMoveSource = null;
        let lastTapInfo = { rowIndex: -1, side: null, time: 0 };
        let singleTapTimer = null;

        let rawOriginalImage = null;
        let rotatedCanvas = null;
        let base90Angle = 0;

        let cropQuad = {
            tl: { x: 0.14, y: 0.36 },
            tr: { x: 0.86, y: 0.36 },
            br: { x: 0.86, y: 0.68 },
            bl: { x: 0.14, y: 0.68 }
        };

        let pendingResultUrl = null;
        let enhanceEnabled = true;

        let activeHandle = null;
        let dragStart = { x: 0, y: 0 };
        let initialQuad = null;
        let loupeScreenPos = null;

        let cssCanvasW = 360;
        let cssCanvasH = 600;

        let slotGesture = null;
        let touchDragState = null;
        let suppressNextClick = false;

        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspaceArea');

        function cloneQuad(q) {
            return {
                tl: { x: q.tl.x, y: q.tl.y },
                tr: { x: q.tr.x, y: q.tr.y },
                br: { x: q.br.x, y: q.br.y },
                bl: { x: q.bl.x, y: q.bl.y }
            };
        }

        function isFullQuad(q) {
            if (!q || !q.tl || !q.tr || !q.br || !q.bl) return false;
            const eps = 0.005;
            return (
                Math.abs(q.tl.x - 0) < eps && Math.abs(q.tl.y - 0) < eps &&
                Math.abs(q.tr.x - 1) < eps && Math.abs(q.tr.y - 0) < eps &&
                Math.abs(q.br.x - 1) < eps && Math.abs(q.br.y - 1) < eps &&
                Math.abs(q.bl.x - 0) < eps && Math.abs(q.bl.y - 1) < eps
            );
        }

        function clamp01(v) {
            return Math.max(0, Math.min(1, v));
        }

        function shiftQuadClamped(q, dNormX, dNormY) {
            const base = cloneQuad(q || FULL_QUAD);
            const minX = Math.min(base.tl.x, base.tr.x, base.br.x, base.bl.x);
            const maxX = Math.max(base.tl.x, base.tr.x, base.br.x, base.bl.x);
            const minY = Math.min(base.tl.y, base.tr.y, base.br.y, base.bl.y);
            const maxY = Math.max(base.tl.y, base.tr.y, base.br.y, base.bl.y);

            const safeDx = Math.max(-minX, Math.min(1 - maxX, dNormX));
            const safeDy = Math.max(-minY, Math.min(1 - maxY, dNormY));

            ['tl', 'tr', 'br', 'bl'].forEach(k => {
                base[k].x = clamp01(base[k].x + safeDx);
                base[k].y = clamp01(base[k].y + safeDy);
            });
            return base;
        }

        function updateMoveModeUI() {
            const banner = document.getElementById('moveModeBanner');
            if (banner) {
                banner.classList.toggle('active', !!pendingMoveSource);
            }
            document.querySelectorAll('.id-box').forEach(el => {
                const r = parseInt(el.dataset.rowIndex, 10);
                const s = el.dataset.side;
                const isSrc = !!(pendingMoveSource && pendingMoveSource.rowIndex === r && pendingMoveSource.side === s);
                el.classList.toggle('moving-selected', isSrc);
                el.classList.toggle('move-target-hint', !!(pendingMoveSource && !isSrc));
            });

        function cancelPendingMove() {
            pendingMoveSource = null;
            lastTapInfo = { rowIndex: -1, side: null, time: 0 };
            if (singleTapTimer) {
                clearTimeout(singleTapTimer);
                singleTapTimer = null;
            }
            updateMoveModeUI();
        }

        function activatePendingMove(rowIndex, side) {
            const item = cardsData[rowIndex];
            const hasImg = side === 'front' ? !!(item && item.frontCropped) : !!(item && item.backCropped);
            if (!hasImg) return;

            if (pendingMoveSource && pendingMoveSource.rowIndex === rowIndex && pendingMoveSource.side === side) {
                cancelPendingMove();
                return;
            }

            pendingMoveSource = { rowIndex, side };
            updateMoveModeUI();
            if (navigator.vibrate) {
                navigator.vibrate(25);
            }
        }

        function handleSlotTapInteraction(rowIndex, side, event) {
            if (suppressNextClick) {
                suppressNextClick = false;
                return;
            }
            if (event) event.stopPropagation();

            const item = cardsData[rowIndex];
            const hasImg = side === 'front' ? !!(item && item.frontCropped) : !!(item && item.backCropped);

            if (pendingMoveSource) {
                const src = pendingMoveSource;
                pendingMoveSource = null;
                lastTapInfo = { rowIndex: -1, side: null, time: 0 };
                if (singleTapTimer) {
                    clearTimeout(singleTapTimer);
                    singleTapTimer = null;
                }
                updateMoveModeUI();

                if (src.rowIndex === rowIndex && src.side === side) {
                    return;
                }
                moveOrSwapSlots(src.rowIndex, src.side, rowIndex, side);
                return;
            }

            if (!hasImg) return;

            const now = Date.now();
            const isDoubleTap = (
                lastTapInfo.rowIndex === rowIndex &&
                lastTapInfo.side === side &&
                (now - lastTapInfo.time) <= 360
            );

            if (singleTapTimer) {
                clearTimeout(singleTapTimer);
                singleTapTimer = null;
            }

            if (isDoubleTap) {
                lastTapInfo = { rowIndex: -1, side: null, time: 0 };
                activatePendingMove(rowIndex, side);
            } else {
                lastTapInfo = { rowIndex, side, time: now };
                singleTapTimer = setTimeout(() => {
                    singleTapTimer = null;
                    lastTapInfo = { rowIndex: -1, side: null, time: 0 };
                    openCropper(rowIndex, side, null);
                }, 260);
            }
        }

            if (!img || !img.naturalWidth || !img.naturalHeight) return false;
            const ratio = img.naturalWidth / img.naturalHeight;
            const isLandscapeCard = ratio >= 1.42 && ratio <= 1.85;
            const isPortraitCard = ratio >= 0.54 && ratio <= 0.70;
            return isLandscapeCard || isPortraitCard;

        function detectContractQuad(source) {
            if (!source) return cloneQuad(FULL_QUAD);
            const srcW = source.naturalWidth || source.width;
            const srcH = source.naturalHeight || source.height;
            if (!srcW || !srcH) return cloneQuad(FULL_QUAD);

            try {
                const sw = Math.min(480, srcW);
                const sh = Math.max(120, Math.round((srcH / srcW) * sw));
                const tmp = document.createElement('canvas');
                tmp.width = sw;
                tmp.height = sh;
                const tCtx = tmp.getContext('2d');
                tCtx.imageSmoothingEnabled = true;
                tCtx.drawImage(source, 0, 0, sw, sh);
                const px = tCtx.getImageData(0, 0, sw, sh).data;

                const isPaperPixel = (x, y) => {
                    const idx = (y * sw + x) * 4;
                    const r = px[idx], g = px[idx + 1], b = px[idx + 2];
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    const sat = Math.max(r, g, b) - Math.min(r, g, b);
                    return lum > 135 && sat < 55;
                };

                let top = 0, bottom = sh - 1, left = 0, right = sw - 1;
                const maxTrimY = Math.floor(sh * 0.18);
                const maxTrimX = Math.floor(sw * 0.18);

                for (let y = 0; y < maxTrimY; y++) {
                    let paperCount = 0;
                    for (let x = 0; x < sw; x += 4) if (isPaperPixel(x, y)) paperCount++;
                    if (paperCount / (sw / 4) > 0.35) { top = y; break; }
                }

                for (let y = sh - 1; y >= sh - maxTrimY; y--) {
                    let paperCount = 0;
                    for (let x = 0; x < sw; x += 4) if (isPaperPixel(x, y)) paperCount++;
                    if (paperCount / (sw / 4) > 0.35) { bottom = y; break; }
                }

                for (let x = 0; x < maxTrimX; x++) {
                    let paperCount = 0;
                    for (let y = 0; y < sh; y += 4) if (isPaperPixel(x, y)) paperCount++;
                    if (paperCount / (sh / 4) > 0.35) { left = x; break; }
                }

                for (let x = sw - 1; x >= sw - maxTrimX; x--) {
                    let paperCount = 0;
                    for (let y = 0; y < sh; y += 4) if (isPaperPixel(x, y)) paperCount++;
                    if (paperCount / (sh / 4) > 0.35) { right = x; break; }
                }

                const padX = Math.round((right - left) * 0.01);
                const padY = Math.round((bottom - top) * 0.01);

                const x1 = Math.max(0, (left - padX) / sw);
                const y1 = Math.max(0, (top - padY) / sh);
                const x2 = Math.min(1, (right + padX) / sw);
                const y2 = Math.min(1, (bottom + padY) / sh);

                if (x2 - x1 > 0.55 && y2 - y1 > 0.55) {
                    return {
                        tl: { x: x1, y: y1 },
                        tr: { x: x2, y: y1 },
                        br: { x: x2, y: y2 },
                        bl: { x: x1, y: y2 }
                    };
                }
            } catch (e) {
                console.warn(e);
            }

            return cloneQuad(FULL_QUAD);
        }

        function detectContractEdges() {

        function detectCardQuad(source) {
            if (!source) return cloneQuad({
                tl: { x: 0.14, y: 0.36 }, tr: { x: 0.86, y: 0.36 },
                br: { x: 0.86, y: 0.68 }, bl: { x: 0.14, y: 0.68 }
            });
            const srcW = source.naturalWidth || source.width;
            const srcH = source.naturalHeight || source.height;
            if (!srcW || !srcH) return cloneQuad({
                tl: { x: 0.14, y: 0.36 }, tr: { x: 0.86, y: 0.36 },
                br: { x: 0.86, y: 0.68 }, bl: { x: 0.14, y: 0.68 }
            });

            const imgRatio = srcW / srcH;
            if ((imgRatio >= 1.42 && imgRatio <= 1.85) || (imgRatio >= 0.54 && imgRatio <= 0.70)) {
                return cloneQuad(FULL_QUAD);
            }

            try {
                const sw = Math.min(640, srcW);
                const sh = Math.max(160, Math.round((srcH / srcW) * sw));
                const tmp = document.createElement('canvas');
                tmp.width = sw;
                tmp.height = sh;
                const tCtx = tmp.getContext('2d');
                tCtx.imageSmoothingEnabled = true;
                tCtx.imageSmoothingQuality = 'high';
                tCtx.drawImage(source, 0, 0, sw, sh);
                const px = tCtx.getImageData(0, 0, sw, sh).data;

                const gridN = 32;
                const cw = sw / gridN;
                const ch = sh / gridN;

                const featGrid = Array.from({ length: gridN }, () => new Float32Array(gridN));
                const edgeGrid = Array.from({ length: gridN }, () => new Float32Array(gridN));

                for (let r = 0; r < gridN; r++) {
                    for (let c = 0; c < gridN; c++) {
                        const x0 = Math.floor(c * cw);
                        const y0 = Math.floor(r * ch);
                        const x1 = Math.min(sw - 1, Math.floor((c + 1) * cw));
                        const y1 = Math.min(sh - 1, Math.floor((r + 1) * ch));

                        let fSum = 0;
                        let eSum = 0;
                        let count = 0;

                        for (let y = y0 + 1; y < y1; y++) {
                            for (let x = x0 + 1; x < x1; x++) {
                                const idx = (y * sw + x) * 4;
                                const idxL = (y * sw + (x - 1)) * 4;
                                const idxU = ((y - 1) * sw + x) * 4;

                                const r0 = px[idx], g0 = px[idx + 1], b0 = px[idx + 2];
                                const lum = 0.299 * r0 + 0.587 * g0 + 0.114 * b0;
                                const lumL = 0.299 * px[idxL] + 0.587 * px[idxL + 1] + 0.114 * px[idxL + 2];
                                const lumU = 0.299 * px[idxU] + 0.587 * px[idxU + 1] + 0.114 * px[idxU + 2];

                                const grad = Math.abs(lum - lumL) + Math.abs(lum - lumU);
                                const sat = Math.max(r0, g0, b0) - Math.min(r0, g0, b0);
                                const isCardTone = (r0 > 70 && g0 > 45 && b0 > 30 && Math.abs(r0 - b0) > 12) || sat > 18;
                                const darkGraphic = lum < 145 ? (145 - lum) * 0.45 : 0;

                                fSum += grad * 0.7 + sat * 1.1 + darkGraphic + (isCardTone ? 14 : 0);
                                eSum += grad;
                                count++;
                            }
                        }

                        featGrid[r][c] = count > 0 ? fSum / count : 0;
                        edgeGrid[r][c] = count > 0 ? eSum / count : 0;
                    }
                }

                const prefFeat = Array.from({ length: gridN + 1 }, () => new Float32Array(gridN + 1));
                const prefEdge = Array.from({ length: gridN + 1 }, () => new Float32Array(gridN + 1));

                for (let r = 1; r <= gridN; r++) {
                    for (let c = 1; c <= gridN; c++) {
                        prefFeat[r][c] = featGrid[r - 1][c - 1]
                            + prefFeat[r - 1][c]
                            + prefFeat[r][c - 1]
                            - prefFeat[r - 1][c - 1];
                        prefEdge[r][c] = edgeGrid[r - 1][c - 1]
                            + prefEdge[r - 1][c]
                            + prefEdge[r][c - 1]
                            - prefEdge[r - 1][c - 1];
                    }
                }

                const rectSum = (pref, r1, c1, r2, c2) => {
                    return pref[r2][c2] - pref[r1][c2] - pref[r2][c1] + pref[r1][c1];
                };

                const cardAspectInGrid = (1.586 * sh) / sw;
                let bestScore = -Infinity;
                let bestRect = null;

                for (let hCells = 6; hCells <= 13; hCells++) {
                    const idealW = Math.max(7, Math.min(gridN - 3, Math.round(hCells * cardAspectInGrid)));
                    const wCandidates = Array.from(new Set([
                        Math.max(7, idealW - 1),
                        idealW,
                        Math.min(gridN - 3, idealW + 1)
                    ]));

                    for (const wCells of wCandidates) {
                        for (let r1 = 3; r1 <= gridN - hCells - 1; r1++) {
                            const r2 = r1 + hCells;
                            for (let c1 = 2; c1 <= gridN - wCells - 2; c1++) {
                                const c2 = c1 + wCells;

                                const area = wCells * hCells;
                                const avgFeat = rectSum(prefFeat, r1, c1, r2, c2) / area;

                                const outerR1 = Math.max(0, r1 - 1);
                                const outerR2 = Math.min(gridN, r2 + 1);
                                const outerC1 = Math.max(0, c1 - 1);
                                const outerC2 = Math.min(gridN, c2 + 1);
                                const outerArea = (outerR2 - outerR1) * (outerC2 - outerC1);
                                const ringArea = Math.max(1, outerArea - area);
                                const ringEdge = (rectSum(prefEdge, outerR1, outerC1, outerR2, outerC2) - rectSum(prefEdge, r1, c1, r2, c2)) / ringArea;

                                const areaRatio = area / (gridN * gridN);
                                const sizeBonus = (areaRatio >= 0.06 && areaRatio <= 0.22) ? 22 : -14;
                                const score = avgFeat * 1.5 + ringEdge * 1.2 + sizeBonus;

                                if (score > bestScore) {
                                    bestScore = score;
                                    bestRect = {
                                        x1: c1 / gridN,
                                        y1: r1 / gridN,
                                        x2: c2 / gridN,
                                        y2: r2 / gridN
                                    };
                                }
                            }
                        }
                    }
                }

                if (bestRect) {
                    return {
                        tl: { x: bestRect.x1, y: bestRect.y1 },
                        tr: { x: bestRect.x2, y: bestRect.y1 },
                        br: { x: bestRect.x2, y: bestRect.y2 },
                        bl: { x: bestRect.x1, y: bestRect.y2 }
                    };
                }
            } catch (err) {
                console.warn(err);
            }

            return cloneQuad({
                tl: { x: 0.14, y: 0.36 }, tr: { x: 0.86, y: 0.36 },
                br: { x: 0.86, y: 0.68 }, bl: { x: 0.14, y: 0.68 }
            });
        }

        function saveToStorage() {

                while (tempData.length > 0) {
                    const last = tempData[tempData.length - 1];
                    if (!last.frontCropped && !last.backCropped) tempData.pop();

                const cleanData = tempData.map(item => ({
                    frontOrigData: item.frontOrigData,
                    frontCropped: item.frontCropped,
                    frontQuad: item.frontQuad,
                    frontRot: item.frontRot,
                    frontIsCropped: item.frontIsCropped,
                    frontView: item.frontView,
                    backOrigData: item.backOrigData,
                    backCropped: item.backCropped,
                    backQuad: item.backQuad,
                    backRot: item.backRot,
                    backIsCropped: item.backIsCropped,
                    backView: item.backView

                localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanData));
