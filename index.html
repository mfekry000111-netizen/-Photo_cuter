<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مُنسق وقاصّ البطاقات الاحترافي مع فرشاة التنسيق</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --accent: #f5b400;
            --dark-bg: #121212;
            --card-bg: #1e1e1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            padding: 12px;
            padding-bottom: 60px;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        header h1 {
            color: var(--accent);
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .upload-section {
            display: block;
            background: linear-gradient(135deg, #f5b400, #d97706);
            color: #000;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            position: relative;
            cursor: pointer;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(245, 180, 0, 0.3);
        }

        .upload-section input[type="file"] {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            overflow: hidden;
            z-index: -1;
        }

        .top-save-bar {
            max-width: 794px;
            margin: 0 auto 12px auto;
            display: flex;
            gap: 8px;
        }

        .btn-global-save {
            flex: 1;
            background: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        /* نافذة الاقتصاص الاحترافية */
        #cropperModal {
            display: none;
            position: fixed;
            inset: 0;
            background: #f4f4f5;
            color: #18181b;
            z-index: 9999;
            flex-direction: column;
            justify-content: space-between;
        }

        .editor-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #ffffff;
            border-bottom: 1px solid #e4e4e7;
            z-index: 10;
        }

        .btn-top-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: #f4f4f5;
            color: #18181b;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .editor-top-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #3f3f46;
        }

        .btn-top-save {
            background: var(--accent);
            color: #000000;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(245, 180, 0, 0.35);
        }

        .editor-workspace {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #e4e4e7;
        }

        #cropCanvas {
            display: block;
            touch-action: none;
        }

        .editor-bottom-panel {
            background: #ffffff;
            padding: 10px 14px 16px;
            border-top: 1px solid #e4e4e7;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 10;
        }

        .reset-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            position: relative;
            height: 34px;
        }

        .btn-reset-all {
            background: none;
            border: none;
            color: #52525b;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 10px;
        }

        .btn-box-zoom {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1.5px solid #d4d4d8;
            background: #f4f4f5;
            color: #18181b;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .btn-box-zoom:active {
            transform: scale(0.92);
            background: var(--accent);
            border-color: var(--accent);
            color: #000000;
        }

        .ruler-container {
            position: relative;
            width: 100%;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ruler-ticks {
            position: absolute;
            inset: 6px 12px;
            background-image: repeating-linear-gradient(
                to right,
                #a1a1aa 0px,
                #a1a1aa 1.5px,
                transparent 1.5px,
                transparent 10px
            );
            pointer-events: none;
            opacity: 0.7;
        }

        .ruler-center-mark {
            position: absolute;
            top: 2px;
            bottom: 2px;
            left: 50%;
            width: 2.5px;
            background: var(--accent);
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 2;
        }

        #angleSlider {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            position: relative;
            z-index: 3;
            cursor: pointer;
        }

        #angleSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 28px;
            border-radius: 4px;
            background: var(--accent);
            border: 2px solid #ffffff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        .quick-tools-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-top: 2px;
        }

        .tool-circle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            cursor: pointer;
            color: #3f3f46;
            font-size: 0.72rem;
            font-weight: 600;
        }

        .circle-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #f4f4f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 800;
            color: #18181b;
            transition: background 0.15s;
        }

        .tool-circle-item:active .circle-icon {
            background: #e4e4e7;
        }

        .circle-icon.active-angle {
            background: var(--accent);
            color: #000000;
        }

        /* تنسيق أوراق الطباعة A4 */
        .page-wrapper { margin-bottom: 25px; }

        .page-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 10px 10px 0 0;
            border: 1px solid #333;
            border-bottom: none;
        }

        .page-toolbar span {
            font-weight: bold;
            color: var(--accent);
            font-size: 0.9rem;
        }

        .toolbar-btns { display: flex; gap: 6px; }

        .tool-btn {
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        .btn-save { background: #2563eb; }
        .btn-wa { background: #16a34a; }
        .btn-pdf { background: #dc2626; }
        .btn-clear-all {
            background: #dc2626;
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .a4-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 794px;
            margin: 0 auto;
            padding: 6px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .id-pair-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            width: 100%;
        }

        .id-box {
            width: 100%;
            aspect-ratio: 1.586 / 1;
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
            touch-action: none;
        }

        .id-box.has-img { border: 1px solid #e2e8f0; }

        .id-box img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            pointer-events: none;
        }

        .tap-hint {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.72);
            color: #fff;
            font-size: 0.61rem;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
        }

        .box-btn-del {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 22px;
            height: 22px;
            background: rgba(220, 38, 38, 0.9);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .box-btn-replace {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 22px;
            height: 22px;
            background: rgba(22, 163, 74, 0.9);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .box-btn-copy-format {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(147, 51, 234, 0.95);
            color: white;
            border-radius: 4px;
            border: none;
            font-size: 0.65rem;
            font-weight: bold;
            padding: 2px 6px;
            cursor: pointer;
            z-index: 5;
        }

        .box-btn-paste-format {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #9333ea;
            color: white;
            border-radius: 6px;
            border: none;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 6px 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.4);
            z-index: 6;
        }

        @media print {
            body { background: white; padding: 0; }
            header, .upload-section, .top-save-bar, .page-toolbar, #cropperModal, .tap-hint, .btn-clear-all, .box-btn-del, .box-btn-replace, .box-btn-copy-format, .box-btn-paste-format { display: none !important; }
            .page-wrapper { margin: 0; page-break-after: always; }
            .a4-sheet { box-shadow: none; width: 210mm; height: 297mm; padding: 5mm; gap: 4mm; }
        }
    </style>
</head>
<body>

    <header>
        <h1>مُنسق وقاصّ البطاقات الاحترافي</h1>
        <p>ميزة فرشاة التنسيق 🎨: اضغط نسخ التنسيق من بطاقة مظبوطة وطبقه على البقية بنقرة واحدة</p>
    </header>

    <label class="upload-section" for="galleryInput">
        🖼️ اختيار صور العقود / البطاقات من المعرض (سيتم رصدهم بالترتيب)
        <input type="file" id="galleryInput" accept="image/*" multiple onclick="this.value=null">
    </label>

    <div class="top-save-bar">
        <button class="btn-global-save" onclick="manualSaveWork()">💾 حفظ العمل يدوياً</button>
    </div>

    <div id="sheetsContainer"></div>
    <div id="clearSection" style="max-width: 794px; margin: 0 auto;"></div>

    <!-- نافذة الاقتصاص الاحترافية -->
    <div id="cropperModal">
        <div class="editor-top-bar">
            <button class="btn-top-close" onclick="closeCropper()" title="إلغاء">✕</button>
            <span class="editor-top-title">اسحب الزوايا أو الأضلاع لتحديد البطاقة بدقة</span>
            <button class="btn-top-save" onclick="saveCroppedResult()">حفظ</button>
        </div>

        <div class="editor-workspace" id="workspaceArea">
            <canvas id="cropCanvas"></canvas>
        </div>

        <div class="editor-bottom-panel">
            <div class="reset-row">
                <button class="btn-box-zoom" onclick="resizeCropBox(0.035)" title="تكبير">+</button>
                <button class="btn-reset-all" onclick="resetCropperState()">إعادة الضبط</button>
                <button class="btn-box-zoom" onclick="resizeCropBox(-0.035)" title="تصغير">−</button>
            </div>

            <div class="ruler-container">
                <div class="ruler-ticks"></div>
                <div class="ruler-center-mark"></div>
                <input type="range" id="angleSlider" min="-45" max="45" value="0" step="0.5" oninput="onAngleSlide(this.value)">
            </div>

            <div class="quick-tools-row">
                <button class="tool-circle-item" onclick="rotate90(-90)">
                    <div class="circle-icon">↺</div>
                    <span>تدوير يسار</span>
                </button>
                <button class="tool-circle-item" onclick="rotate90(90)">
                    <div class="circle-icon">↻</div>
                    <span>تدوير يمين</span>
                </button>
                <button class="tool-circle-item" onclick="resetZoomView()">
                    <div class="circle-icon">🔍</div>
                    <span>عرض كامل</span>
                </button>
                <button class="tool-circle-item" onclick="toggleAspectLock()">
                    <div class="circle-icon" id="ratioIcon">🪪</div>
                    <span id="ratioLabel">نسبة البطاقة</span>
                </button>
                <div class="tool-circle-item">
                    <div class="circle-icon active-angle" id="angleBadge">0°</div>
                    <span>تدوير</span>
                </div>
            </div>
        </div>
    </div>

    <!-- حقل مخفي لاستبدال صورة فردية -->
    <input type="file" id="replaceInput" accept="image/*" style="display:none" onchange="handleReplaceFile(this)">

    <script>
        let cardsData = [];
        let activeRowIndex = -1;
        let activeSide = 'front';
        let replaceTargetIndex = -1;
        let replaceTargetSide = null;

        // متغيرات فرشاة نسخ التنسيق
        let copiedFormatData = null;

        let rawOriginalImage = null;
        let rotatedCanvas = null;
        let fineAngle = 0;
        let base90Angle = 0;
        let lockIdRatio = false;

        let cropBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };

        let viewCam = { scale: 1, offsetX: 0, offsetY: 0 };
        let targetCam = { scale: 1, offsetX: 0, offsetY: 0 };
        let animFrameId = null;

        let activeHandle = null;
        let dragStart = { x: 0, y: 0 };
        let initialBox = null;

        const canvas = document.getElementById('cropCanvas');
        const ctx = canvas.getContext('2d');
        const workspace = document.getElementById('workspaceArea');

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('pro_id_cards_v34');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    cardsData = parsed.map(item => {
                        let fImg = null, bImg = null;
                        if (item.frontOrigData) { fImg = new Image(); fImg.src = item.frontOrigData; }
                        if (item.backOrigData) { bImg = new Image(); bImg.src = item.backOrigData; }
                        return {
                            frontOriginal: fImg,
                            frontOrigData: item.frontOrigData,
                            frontCropped: item.frontCropped,
                            frontBox: item.frontBox || { x: 0.28, y: 0.45, w: 0.44, h: 0.277 },
                            frontRot: item.frontRot || { base: 0, fine: 0 },
                            backOriginal: bImg,
                            backOrigData: item.backOrigData,
                            backCropped: item.backCropped,
                            backBox: item.backBox || { x: 0.28, y: 0.45, w: 0.44, h: 0.277 },
                            backRot: item.backRot || { base: 0, fine: 0 }
                        };
                    });
                } catch (e) { console.error(e); }
            }
            ensureEmptySlots();
            renderSheets();
        });

        function saveToStorage() {
            try {
                while (cardsData.length > 0) {
                    const last = cardsData[cardsData.length - 1];
                    if (!last.frontCropped && !last.backCropped) cardsData.pop();
                    else break;
                }

                const cleanData = cardsData.map(item => ({
                    frontOrigData: item.frontOrigData,
                    frontCropped: item.frontCropped,
                    frontBox: item.frontBox,
                    frontRot: item.frontRot,
                    backOrigData: item.backOrigData,
                    backCropped: item.backCropped,
                    backBox: item.backBox,
                    backRot: item.backRot
                }));
                localStorage.setItem('pro_id_cards_v34', JSON.stringify(cleanData));
            } catch (e) {
                console.warn('تم تجاوز سعة التخزين المؤقت للمتصفح.');
            }
        }

        function ensureEmptySlots() {
            while (cardsData.length < 5) {
                cardsData.push({
                    frontOriginal: null, frontOrigData: null, frontCropped: null, frontBox: { x: 0.28, y: 0.45, w: 0.44, h: 0.277 }, frontRot: { base: 0, fine: 0 },
                    backOriginal: null, backOrigData: null, backCropped: null, backBox: { x: 0.28, y: 0.45, w: 0.44, h: 0.277 }, backRot: { base: 0, fine: 0 }
                });
            }
        }

        function manualSaveWork() {
            saveToStorage();
            alert('✅ تم حفظ العمل بنجاح!');
        }

        function clearAllData() {
            if (confirm('هل تريد مسح جميع البطاقات والبدء من جديد؟')) {
                localStorage.removeItem('pro_id_cards_v34');
                cardsData = [];
                ensureEmptySlots();
                renderSheets();
            }
        }

        function buildRotatedFullResCanvas(img, totalDegrees) {
            const rad = (totalDegrees * Math.PI) / 180;
            const sin = Math.abs(Math.sin(rad));
            const cos = Math.abs(Math.cos(rad));
            const newW = Math.round(img.naturalWidth * cos + img.naturalHeight * sin);
            const newH = Math.round(img.naturalWidth * sin + img.naturalHeight * cos);

            const offCanvas = document.createElement('canvas');
            offCanvas.width = newW;
            offCanvas.height = newH;
            const offCtx = offCanvas.getContext('2d');
            offCtx.imageSmoothingEnabled = true;
            offCtx.imageSmoothingQuality = 'high';

            offCtx.translate(newW / 2, newH / 2);
            offCtx.rotate(rad);
            offCtx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
            return offCanvas;
        }

        function extractHighResCrop(sourceCanvas, box) {
            const sx = Math.max(0, Math.round(box.x * sourceCanvas.width));
            const sy = Math.max(0, Math.round(box.y * sourceCanvas.height));
            const sw = Math.min(sourceCanvas.width - sx, Math.round(box.w * sourceCanvas.width));
            const sh = Math.min(sourceCanvas.height - sy, Math.round(box.h * sourceCanvas.height));

            const outCanvas = document.createElement('canvas');
            outCanvas.width = Math.max(sw, 1100);
            outCanvas.height = Math.round(outCanvas.width / 1.586);

            const outCtx = outCanvas.getContext('2d');
            outCtx.imageSmoothingEnabled = true;
            outCtx.imageSmoothingQuality = 'high';
            outCtx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, outCanvas.width, outCanvas.height);

            return outCanvas.toDataURL('image/jpeg', 0.96);
        }

        function recomputeCroppedImage(item, side) {
            const origImg = side === 'front' ? item.frontOriginal : item.backOriginal;
            const origData = side === 'front' ? item.frontOrigData : item.backOrigData;
            const box = side === 'front' ? item.frontBox : item.backBox;
            const rot = side === 'front' ? item.frontRot : item.backRot;

            if (!origData) return;

            if (origImg && origImg.complete && origImg.naturalWidth > 0) {
                const rotCanvas = buildRotatedFullResCanvas(origImg, (rot ? rot.base + rot.fine : 0));
                const newUrl = extractHighResCrop(rotCanvas, box);
                if (side === 'front') item.frontCropped = newUrl;
                else item.backCropped = newUrl;
                saveToStorage();
                renderSheets();
            } else {
                const tempImg = new Image();
                tempImg.onload = () => {
                    if (side === 'front') item.frontOriginal = tempImg;
                    else item.backOriginal = tempImg;
                    const rotCanvas = buildRotatedFullResCanvas(tempImg, (rot ? rot.base + rot.fine : 0));
                    const newUrl = extractHighResCrop(rotCanvas, box);
                    if (side === 'front') item.frontCropped = newUrl;
                    else item.backCropped = newUrl;
                    saveToStorage();
                    renderSheets();
                };
                tempImg.src = origData;
            }
        }

        // دالة نسخ تنسيق البطاقة (الفرشاة)
        function copyCardFormat(rowIndex, side, event) {
            event.stopPropagation();
            const item = cardsData[rowIndex];
            if (!item) return;

            copiedFormatData = {
                box: JSON.parse(JSON.stringify(side === 'front' ? item.frontBox : item.backBox)),
                rot: JSON.parse(JSON.stringify(side === 'front' ? item.frontRot : item.backRot))
            };
            alert('🎨 تم نسخ تنسيق وقص هذه البطاقة بنجاح! اضغط الآن على (📌 لصق التنسيق) في أي بطاقة أخرى لتطبيقها.');
            renderSheets();
        }

        // دالة تطبيق تنسيق البطاقة المنسوخة على بطاقة أخرى
        function pasteCardFormat(targetRowIndex, targetSide, event) {
            event.stopPropagation();
            if (!copiedFormatData) return;

            const item = cardsData[targetRowIndex];
            if (!item || !(targetSide === 'front' ? item.frontOrigData : item.backOrigData)) {
                alert('⚠️ هذه البطاقة فارغة، الرجاء اختيار بطاقة بها صورة أولاً.');
                return;
            }

            if (targetSide === 'front') {
                item.frontBox = JSON.parse(JSON.stringify(copiedFormatData.box));
                item.frontRot = JSON.parse(JSON.stringify(copiedFormatData.rot));
                recomputeCroppedImage(item, 'front');
            } else {
                item.backBox = JSON.parse(JSON.stringify(copiedFormatData.box));
                item.backRot = JSON.parse(JSON.stringify(copiedFormatData.rot));
                recomputeCroppedImage(item, 'back');
            }

            alert('✨ تم تطبيق التنسيق والقص بنجاح على البطاقة!');
            renderSheets();
        }

        document.getElementById('galleryInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            let loadedCount = 0;
            const loadedImages = new Array(files.length);

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        loadedImages[index] = { img: img, dataUrl: ev.target.result };
                        loadedCount++;

                        if (loadedCount === files.length) {
                            loadedImages.forEach(entry => {
                                const fullCanvas = buildRotatedFullResCanvas(entry.img, 0);
                                const defaultBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
                                const croppedUrl = extractHighResCrop(fullCanvas, defaultBox);

                                let placed = false;
                                for (let i = 0; i < cardsData.length; i++) {
                                    if (!cardsData[i].frontCropped) {
                                        cardsData[i].frontOriginal = entry.img;
                                        cardsData[i].frontOrigData = entry.dataUrl;
                                        cardsData[i].frontCropped = croppedUrl;
                                        cardsData[i].frontBox = defaultBox;
                                        cardsData[i].frontRot = { base: 0, fine: 0 };
                                        placed = true;
                                        break;
                                    } else if (!cardsData[i].backCropped) {
                                        cardsData[i].backOriginal = entry.img;
                                        cardsData[i].backOrigData = entry.dataUrl;
                                        cardsData[i].backCropped = croppedUrl;
                                        cardsData[i].backBox = defaultBox;
                                        cardsData[i].backRot = { base: 0, fine: 0 };
                                        placed = true;
                                        break;
                                    }
                                }

                                if (!placed) {
                                    cardsData.push({
                                        frontOriginal: entry.img,
                                        frontOrigData: entry.dataUrl,
                                        frontCropped: croppedUrl,
                                        frontBox: defaultBox,
                                        frontRot: { base: 0, fine: 0 },
                                        backOriginal: null, backOrigData: null, backCropped: null,
                                        backBox: defaultBox, backRot: { base: 0, fine: 0 }
                                    });
                                }
                            });

                            ensureEmptySlots();
                            saveToStorage();
                            renderSheets();
                        }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
            this.value = '';
        });

        function openCropper(rowIndex, side) {
            const item = cardsData[rowIndex];
            if (!item || !(side === 'front' ? item.frontCropped : item.backCropped)) return;

            activeRowIndex = rowIndex;
            activeSide = side;

            let imgObj = side === 'front' ? item.frontOriginal : item.backOriginal;
            const origData = side === 'front' ? item.frontOrigData : item.backOrigData;
            const savedBox = side === 'front' ? item.frontBox : item.backBox;
            const savedRot = side === 'front' ? item.frontRot : item.backRot;

            const startWithImage = (loadedImg) => {
                rawOriginalImage = loadedImg;
                base90Angle = savedRot ? savedRot.base : 0;
                fineAngle = savedRot ? savedRot.fine : 0;
                document.getElementById('angleSlider').value = fineAngle;
                updateAngleBadge();

                rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, base90Angle + fineAngle);
                cropBox = savedBox ? JSON.parse(JSON.stringify(savedBox)) : { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };

                document.getElementById('cropperModal').style.display = 'flex';
                resizeCanvasToWorkspace();
                
                const base = getBaseImageRect();
                const cropPixelW = cropBox.w * base.w;
                const targetScale = Math.min((canvas.width * 0.85) / cropPixelW, 3.5);

                const cropCenterX = base.x + (cropBox.x + cropBox.w / 2) * base.w;
                const cropCenterY = base.y + (cropBox.y + cropBox.h / 2) * base.h;

                viewCam = {
                    scale: targetScale,
                    offsetX: (canvas.width / 2) - cropCenterX * targetScale,
                    offsetY: (canvas.height / 2) - cropCenterY * targetScale
                };
                targetCam = { ...viewCam };

                renderCropperCanvas();
            };

            if (imgObj && imgObj.complete && imgObj.naturalWidth > 0) {
                startWithImage(imgObj);
            } else if (origData) {
                const tempImg = new Image();
                tempImg.onload = () => {
                    if (side === 'front') item.frontOriginal = tempImg;
                    else item.backOriginal = tempImg;
                    startWithImage(tempImg);
                };
                tempImg.src = origData;
            }
        }

        function closeCropper() {
            document.getElementById('cropperModal').style.display = 'none';
            if (animFrameId) cancelAnimationFrame(animFrameId);
        }

        function resizeCanvasToWorkspace() {
            canvas.width = workspace.clientWidth;
            canvas.height = workspace.clientHeight;
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('cropperModal').style.display === 'flex') {
                resizeCanvasToWorkspace();
            }
        });

        function getBaseImageRect() {
            if (!rotatedCanvas) return { x: 0, y: 0, w: 100, h: 100 };
            const pad = 28;
            const availW = canvas.width - pad * 2;
            const availH = canvas.height - pad * 2;
            const scale = Math.min(availW / rotatedCanvas.width, availH / rotatedCanvas.height);
            const w = rotatedCanvas.width * scale;
            const h = rotatedCanvas.height * scale;
            return {
                x: (canvas.width - w) / 2,
                y: (canvas.height - h) / 2,
                w: w,
                h: h
            };
        }

        function resetZoomView() {
            if (!rotatedCanvas) return;
            const base = getBaseImageRect();
            const cropPixelW = cropBox.w * base.w;
            const targetScale = Math.min((canvas.width * 0.85) / cropPixelW, 3.5);
            const cropCenterX = base.x + (cropBox.x + cropBox.w / 2) * base.w;
            const cropCenterY = base.y + (cropBox.y + cropBox.h / 2) * base.h;

            targetCam = {
                scale: targetScale,
                offsetX: (canvas.width / 2) - cropCenterX * targetScale,
                offsetY: (canvas.height / 2) - cropCenterY * targetScale
            };
            animateCamera();
        }

        function animateCamera() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            const step = () => {
                const ease = 0.22;
                viewCam.scale += (targetCam.scale - viewCam.scale) * ease;
                viewCam.offsetX += (targetCam.offsetX - viewCam.offsetX) * ease;
                viewCam.offsetY += (targetCam.offsetY - viewCam.offsetY) * ease;

                renderCropperCanvas();

                if (
                    Math.abs(targetCam.scale - viewCam.scale) > 0.002 ||
                    Math.abs(targetCam.offsetX - viewCam.offsetX) > 0.2 ||
                    Math.abs(targetCam.offsetY - viewCam.offsetY) > 0.2
                ) {
                    animFrameId = requestAnimationFrame(step);
                } else {
                    viewCam = { ...targetCam };
                    renderCropperCanvas();
                }
            };
            animFrameId = requestAnimationFrame(step);
        }

        function renderCropperCanvas() {
            if (!rotatedCanvas) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const base = getBaseImageRect();

            ctx.save();
            ctx.translate(viewCam.offsetX, viewCam.offsetY);
            ctx.scale(viewCam.scale, viewCam.scale);

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(rotatedCanvas, base.x, base.y, base.w, base.h);

            const bx = base.x + cropBox.x * base.w;
            const by = base.y + cropBox.y * base.h;
            const bw = cropBox.w * base.w;
            const bh = cropBox.h * base.h;

            ctx.fillStyle = 'rgba(244, 244, 245, 0.72)';
            ctx.beginPath();
            ctx.rect(base.x - 2000, base.y - 2000, base.w + 4000, base.h + 4000);
            ctx.rect(bx, by, bw, bh);
            ctx.fill('evenodd');

            const invScale = 1 / viewCam.scale;

            ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
            ctx.lineWidth = 1 * invScale;
            ctx.strokeRect(bx, by, bw, bh);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
            ctx.lineWidth = 1 * invScale;
            ctx.beginPath();
            ctx.moveTo(bx + bw / 3, by);
            ctx.lineTo(bx + bw / 3, by + bh);
            ctx.moveTo(bx + (bw * 2) / 3, by);
            ctx.lineTo(bx + (bw * 2) / 3, by + bh);
            ctx.moveTo(bx, by + bh / 3);
            ctx.lineTo(bx + bw, by + bh / 3);
            ctx.moveTo(bx, by + (bh * 2) / 3);
            ctx.lineTo(bx + bw, by + (bh * 2) / 3);
            ctx.stroke();

            ctx.strokeStyle = '#111111';
            ctx.lineWidth = 4.2 * invScale;
            ctx.lineCap = 'square';

            const cornerLen = Math.min(22 * invScale, bw * 0.22, bh * 0.22);
            const barLen = Math.min(24 * invScale, bw * 0.25, bh * 0.25);

            ctx.beginPath();
            ctx.moveTo(bx, by + cornerLen);
            ctx.lineTo(bx, by);
            ctx.lineTo(bx + cornerLen, by);

            ctx.moveTo(bx + bw - cornerLen, by);
            ctx.lineTo(bx + bw, by);
            ctx.lineTo(bx + bw, by + cornerLen);

            ctx.moveTo(bx + bw, by + bh - cornerLen);
            ctx.lineTo(bx + bw, by + bh);
            ctx.lineTo(bx + bw - cornerLen, by + bh);

            ctx.moveTo(bx + cornerLen, by + bh);
            ctx.lineTo(bx, by + bh);
            ctx.lineTo(bx, by + bh - cornerLen);

            ctx.moveTo(bx + bw / 2 - barLen / 2, by);
            ctx.lineTo(bx + bw / 2 + barLen / 2, by);

            ctx.moveTo(bx + bw / 2 - barLen / 2, by + bh);
            ctx.lineTo(bx + bw / 2 + barLen / 2, by + bh);

            ctx.moveTo(bx, by + bh / 2 - barLen / 2);
            ctx.lineTo(bx, by + bh / 2 + barLen / 2);

            ctx.moveTo(bx + bw, by + bh / 2 - barLen / 2);
            ctx.lineTo(bx + bw, by + bh / 2 + barLen / 2);

            ctx.stroke();
            ctx.restore();
        }

        function screenToImageNorm(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const sx = clientX - rect.left;
            const sy = clientY - rect.top;

            const wx = (sx - viewCam.offsetX) / viewCam.scale;
            const wy = (sy - viewCam.offsetY) / viewCam.scale;

            const base = getBaseImageRect();
            return {
                x: (wx - base.x) / base.w,
                y: (wy - base.y) / base.h,
                wx: wx,
                wy: wy
            };
        }

        function onTouchStart(e) {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = screenToImageNorm(clientX, clientY);
            const base = getBaseImageRect();

            const bx = base.x + cropBox.x * base.w;
            const by = base.y + cropBox.y * base.h;
            const bw = cropBox.w * base.w;
            const bh = cropBox.h * base.h;

            const hitRadius = 26 / viewCam.scale;

            const handles = [
                { name: 'tl', x: bx, y: by },
                { name: 'tr', x: bx + bw, y: by },
                { name: 'br', x: bx + bw, y: by + bh },
                { name: 'bl', x: bx, y: by + bh },
                { name: 't',  x: bx + bw / 2, y: by },
                { name: 'b',  x: bx + bw / 2, y: by + bh },
                { name: 'l',  x: bx, y: by + bh / 2 },
                { name: 'r',  x: bx + bw, y: by + bh / 2 }
            ];

            let closest = null;
            let minDist = hitRadius;
            handles.forEach(h => {
                const d = Math.hypot(pt.wx - h.x, pt.wy - h.y);
                if (d < minDist) {
                    minDist = d;
                    closest = h.name;
                }
            });

            if (closest) {
                activeHandle = closest;
            } else if (pt.wx >= bx && pt.wx <= bx + bw && pt.wy >= by && pt.wy <= by + bh) {
                activeHandle = 'move';
            } else {
                activeHandle = null;
                return;
            }

            dragStart = { x: pt.x, y: pt.y };
            initialBox = { ...cropBox };
        }

        function onTouchMove(e) {
            if (!activeHandle) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = screenToImageNorm(clientX, clientY);

            const dx = pt.x - dragStart.x;
            const dy = pt.y - dragStart.y;
            const minSize = 0.08;

            let { x, y, w, h } = initialBox;

            if (activeHandle === 'move') {
                x = Math.max(0, Math.min(1 - w, x + dx));
                y = Math.max(0, Math.min(1 - h, y + dy));
            } else {
                if (activeHandle.includes('l')) {
                    const newX = Math.max(0, Math.min(x + w - minSize, x + dx));
                    w = (x + w) - newX;
                    x = newX;
                }
                if (activeHandle.includes('r')) {
                    w = Math.max(minSize, Math.min(1 - x, w + dx));
                }
                if (activeHandle.includes('t')) {
                    const newY = Math.max(0, Math.min(y + h - minSize, y + dy));
                    h = (y + h) - newY;
                    y = newY;
                }
                if (activeHandle.includes('b')) {
                    h = Math.max(minSize, Math.min(1 - y, h + dy));
                }

                if (lockIdRatio && rotatedCanvas) {
                    const imgAspect = rotatedCanvas.width / rotatedCanvas.height;
                    const targetH = (w * imgAspect) / 1.586;
                    if (y + targetH <= 1) {
                        h = targetH;
                    }
                }
            }

            cropBox = { x, y, w, h };
            renderCropperCanvas();
        }

        function onTouchEnd() {
            if (activeHandle) {
                activeHandle = null;
            }
        }

        canvas.addEventListener('mousedown', onTouchStart);
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('mousemove', onTouchMove);
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('mouseup', onTouchEnd);
        window.addEventListener('touchend', onTouchEnd);

        function resizeCropBox(delta) {
            if (!rotatedCanvas) return;
            const cx = cropBox.x + cropBox.w / 2;
            const cy = cropBox.y + cropBox.h / 2;
            const aspect = cropBox.w / cropBox.h;

            let newW = Math.max(0.12, Math.min(0.98, cropBox.w + delta));
            let newH = newW / aspect;

            if (newH > 0.98) {
                newH = 0.98;
                newW = newH * aspect;
            }
            if (newH < 0.08) {
                newH = 0.08;
                newW = newH * aspect;
            }

            const newX = Math.max(0, Math.min(1 - newW, cx - newW / 2));
            const newY = Math.max(0, Math.min(1 - newH, cy - newH / 2));

            cropBox = { x: newX, y: newY, w: newW, h: newH };
            renderCropperCanvas();
        }

        function onAngleSlide(val) {
            fineAngle = parseFloat(val);
            updateAngleBadge();
            if (!rawOriginalImage) return;
            rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, base90Angle + fineAngle);
            renderCropperCanvas();
        }

        function rotate90(delta) {
            base90Angle = (base90Angle + delta + 360) % 360;
            if (!rawOriginalImage) return;
            rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, base90Angle + fineAngle);
            renderCropperCanvas();
        }

        function updateAngleBadge() {
            const badge = document.getElementById('angleBadge');
            badge.innerText = (fineAngle > 0 ? '+' : '') + Math.round(fineAngle) + '°';
        }

        function toggleAspectLock() {
            lockIdRatio = !lockIdRatio;
            const icon = document.getElementById('ratioIcon');
            const label = document.getElementById('ratioLabel');
            if (lockIdRatio) {
                icon.style.background = '#f5b400';
                icon.style.color = '#000';
                label.innerText = 'نسبة مقفلة';
                if (rotatedCanvas) {
                    const imgAspect = rotatedCanvas.width / rotatedCanvas.height;
                    cropBox.h = Math.min(1 - cropBox.y, (cropBox.w * imgAspect) / 1.586);
                    renderCropperCanvas();
                }
            } else {
                icon.style.background = '#f4f4f5';
                icon.style.color = '#18181b';
                label.innerText = 'نسبة البطاقة';
            }
        }

        function resetCropperState() {
            base90Angle = 0;
            fineAngle = 0;
            document.getElementById('angleSlider').value = 0;
            updateAngleBadge();
            if (rawOriginalImage) {
                rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, 0);
                cropBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
                renderCropperCanvas();
            }
        }

        function saveCroppedResult() {
            if (activeRowIndex === -1 || !rotatedCanvas) return;
            const item = cardsData[activeRowIndex];
            const highResUrl = extractHighResCrop(rotatedCanvas, cropBox);

            if (activeSide === 'front') {
                item.frontCropped = highResUrl;
                item.frontBox = { ...cropBox };
                item.frontRot = { base: base90Angle, fine: fineAngle };
            } else {
                item.backCropped = highResUrl;
                item.backBox = { ...cropBox };
                item.backRot = { base: base90Angle, fine: fineAngle };
            }

            closeCropper();
            saveToStorage();
            renderSheets();
        }

        function deleteSingleImage(rowIndex, side, event) {
            event.stopPropagation();
            const item = cardsData[rowIndex];
            if (!item) return;

            if (side === 'front') {
                item.frontOriginal = null;
                item.frontOrigData = null;
                item.frontCropped = null;
                item.frontBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
            } else {
                item.backOriginal = null;
                item.backOrigData = null;
                item.backCropped = null;
                item.backBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };

            ensureEmptySlots();
            saveToStorage();
            renderSheets();

        function triggerReplaceImage(rowIndex, side, event) {
            event.stopPropagation();
            replaceTargetIndex = rowIndex;
            replaceTargetSide = side;
            document.getElementById('replaceInput').value = null;
            document.getElementById('replaceInput').click();
        }

        function handleReplaceFile(input) {
            const file = input.files[0];
            if (!file || replaceTargetIndex === -1 || !replaceTargetSide) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const fullCanvas = buildRotatedFullResCanvas(img, 0);
                    const detectedBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
                    const croppedUrl = extractHighResCrop(fullCanvas, detectedBox);

                    const item = cardsData[replaceTargetIndex];
                    if (replaceTargetSide === 'front') {
                        item.frontOriginal = img;
                        item.frontOrigData = ev.target.result;
                        item.frontCropped = croppedUrl;
                        item.frontBox = detectedBox;
                        item.frontRot = { base: 0, fine: 0 };
                    } else {
                        item.backOriginal = img;
                        item.backOrigData = ev.target.result;
                        item.backCropped = croppedUrl;
                        item.backBox = detectedBox;
                        item.backRot = { base: 0, fine: 0 };
                    }

                    ensureEmptySlots();
                    saveToStorage();
                    renderSheets();
                    replaceTargetIndex = -1;
                    replaceTargetSide = null;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleDragStart(e, rowIndex, side) {
            e.dataTransfer.setData('text/plain', JSON.stringify({ rowIndex, side }));
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        function handleDrop(e, targetRowIndex, targetSide) {
            e.preventDefault();
            const dataStr = e.dataTransfer.getData('text/plain');
            if (!dataStr) return;
            const src = JSON.parse(dataStr);

            if (src.rowIndex === targetRowIndex && src.side === targetSide) return;

            const srcItem = cardsData[src.rowIndex];
            const targetItem = cardsData[targetRowIndex];

            const srcData = src.side === 'front' ? {
                orig: srcItem.frontOriginal, origData: srcItem.frontOrigData, cropped: srcItem.frontCropped, box: srcItem.frontBox, rot: srcItem.frontRot
            } : {
                orig: srcItem.backOriginal, origData: srcItem.backOrigData, cropped: srcItem.backCropped, box: srcItem.backBox, rot: srcItem.backRot
            };

            const targetHasData = targetSide === 'front' ? !!targetItem.frontCropped : !!targetItem.backCropped;

            if (!targetHasData) {
                if (targetSide === 'front') {
                    targetItem.frontOriginal = srcData.orig; targetItem.frontOrigData = srcData.origData; targetItem.frontCropped = srcData.cropped; targetItem.frontBox = srcData.box; targetItem.frontRot = srcData.rot;
                } else {
                    targetItem.backOriginal = srcData.orig; targetItem.backOrigData = srcData.origData; targetItem.backCropped = srcData.cropped; targetItem.backBox = srcData.box; targetItem.backRot = srcData.rot;
                }

                if (src.side === 'front') {
                    srcItem.frontOriginal = null; srcItem.frontOrigData = null; srcItem.frontCropped = null; srcItem.frontBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
                } else {
                    srcItem.backOriginal = null; srcItem.backOrigData = null; srcItem.backCropped = null; srcItem.backBox = { x: 0.28, y: 0.45, w: 0.44, h: 0.277 };
                }
            } else {
                const targetData = targetSide === 'front' ? {
                    orig: targetItem.frontOriginal, origData: targetItem.frontOrigData, cropped: targetItem.frontCropped, box: targetItem.frontBox, rot: targetItem.frontRot
                } : {
                    orig: targetItem.backOriginal, origData: targetItem.backOrigData, cropped: targetItem.backCropped, box: targetItem.backBox, rot: targetItem.backRot
                };

                if (src.side === 'front') {
                    srcItem.frontOriginal = targetData.orig; srcItem.frontOrigData = targetData.origData; srcItem.frontCropped = targetData.cropped; srcItem.frontBox = targetData.box; srcItem.frontRot = targetData.rot;
                } else {
                    srcItem.backOriginal = targetData.orig; srcItem.backOrigData = targetData.origData; srcItem.backCropped = targetData.cropped; srcItem.backBox = targetData.box; srcItem.backRot = targetData.rot;
                }

                if (targetSide === 'front') {
                    targetItem.frontOriginal = srcData.orig; targetItem.frontOrigData = srcData.origData; targetItem.frontCropped = srcData.cropped; targetItem.frontBox = srcData.box; targetItem.frontRot = srcData.rot;
                } else {
                    targetItem.backOriginal = srcData.orig; targetItem.backOrigData = srcData.origData; targetItem.backCropped = srcData.cropped; targetItem.backBox = srcData.box; targetItem.backRot = srcData.rot;
                }
            }

            ensureEmptySlots();
            saveToStorage();
            renderSheets();
        }

        function initDirectTouch(boxEl, rowIndex, side) {
            let startX = 0, startY = 0;
            let isDragging = false;

            boxEl.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'SPAN') return;
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, { passive: true });

            boxEl.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const currentX = e.touches[0].clientX;
                const currentY = e.touches[0].clientY;

                const dx = (currentX - startX);
                const dy = (currentY - startY);

                if (Math.hypot(dx, dy) > 8) {
                    const item = cardsData[rowIndex];
                    if (!item) return;
                    const box = side === 'front' ? item.frontBox : item.backBox;

                    box.x = Math.max(0, Math.min(1 - box.w, box.x - (dx * 0.0006)));
                    box.y = Math.max(0, Math.min(1 - box.h, box.y - (dy * 0.0006)));

                    startX = currentX;
                    startY = currentY;

                    recomputeCroppedImage(item, side);
                }
            }, { passive: true });

            boxEl.addEventListener('touchend', () => {
                isDragging = false;
            });
        }

        function renderSheets() {
            const container = document.getElementById('sheetsContainer');
            const clearSection = document.getElementById('clearSection');
            container.innerHTML = '';
            clearSection.innerHTML = '';

            const totalSheets = Math.max(1, Math.ceil(cardsData.filter(i => i.frontCropped || i.backCropped).length / 5) + 1);

            for (let s = 0; s < totalSheets; s++) {
                const slice = cardsData.slice(s * 5, (s + 1) * 5);
                if (s > 0 && slice.every(i => !i.frontCropped && !i.backCropped)) continue;

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';

                const toolbar = document.createElement('div');
                toolbar.className = 'page-toolbar';
                toolbar.innerHTML = `
                    <span>ورقة طباعة (${s + 1}) - A4</span>
                    <div class="toolbar-btns">
                        <button class="tool-btn btn-save" onclick="exportSheet('sheet-${s}', ${s + 1}, false)">💾 حفظ صورة</button>
                        <button class="tool-btn btn-wa" onclick="exportSheet('sheet-${s}', ${s + 1}, true)">📲 مشاركة واتس</button>
                        <button class="tool-btn btn-pdf" onclick="window.print()">🖨️ طباعة PDF</button>
                    </div>
                `;

                const sheet = document.createElement('div');
                sheet.className = 'a4-sheet';
                sheet.id = `sheet-${s}`;

                for (let r = 0; r < 5; r++) {
                    const pair = slice[r] || { frontCropped: null, backCropped: null };
                    const globalIdx = (s * 5) + r;

                    const row = document.createElement('div');
                    row.className = 'id-pair-row';

                    // الوش
                    const frontBox = document.createElement('div');
                    frontBox.className = 'id-box' + (pair.frontCropped ? ' has-img' : '');
                    frontBox.ondragover = handleDragOver;
                    frontBox.ondrop = (e) => handleDrop(e, globalIdx, 'front');

                    if (pair.frontCropped) {
                        frontBox.draggable = true;
                        frontBox.ondragstart = (e) => handleDragStart(e, globalIdx, 'front');
                        
                        let extraPasteBtn = '';
                        if (copiedFormatData) {
                            extraPasteBtn = `<button class="box-btn-paste-format" onclick="pasteCardFormat(${globalIdx}, 'front', event)">📌 لصق التنسيق</button>`;
                        }

                        frontBox.innerHTML = `
                            <img src="${pair.frontCropped}">
                            <span class="tap-hint">اسحب للنقل</span>
                            <button class="box-btn-del" onclick="deleteSingleImage(${globalIdx}, 'front', event)" title="حذف">✕</button>
                            <button class="box-btn-replace" onclick="triggerReplaceImage(${globalIdx}, 'front', event)" title="استبدال">+</button>
                            <button class="box-btn-copy-format" onclick="copyCardFormat(${globalIdx}, 'front', event)" title="نسخ التنسيق">🎨 نسخ</button>
                            ${extraPasteBtn}
                        `;
                        frontBox.ondblclick = () => openCropper(globalIdx, 'front');
                        initDirectTouch(frontBox, globalIdx, 'front');
                    } else {
                        let extraPasteBtn = '';
                        if (copiedFormatData && cardsData[globalIdx].frontOrigData) {
                            extraPasteBtn = `<button class="box-btn-paste-format" onclick="pasteCardFormat(${globalIdx}, 'front', event)">📌 لصق التنسيق</button>`;
                        }
                        frontBox.innerHTML = `<span>وش البطاقة</span>${extraPasteBtn}`;
                    }

                    // الظهر
                    const backBox = document.createElement('div');
                    backBox.className = 'id-box' + (pair.backCropped ? ' has-img' : '');
                    backBox.ondragover = handleDragOver;
                    backBox.ondrop = (e) => handleDrop(e, globalIdx, 'back');

                    if (pair.backCropped) {
                        backBox.draggable = true;
                        backBox.ondragstart = (e) => handleDragStart(e, globalIdx, 'back');
                        
                        let extraPasteBtn = '';
                        if (copiedFormatData) {
                            extraPasteBtn = `<button class="box-btn-paste-format" onclick="pasteCardFormat(${globalIdx}, 'back', event)">📌 لصق التنسيق</button>`;
                        }

                        backBox.innerHTML = `
                            <img src="${pair.backCropped}">
                            <span class="tap-hint">اسحب للنقل</span>
                            <button class="box-btn-del" onclick="deleteSingleImage(${globalIdx}, 'back', event)" title="حذف">✕</button>
                            <button class="box-btn-replace" onclick="triggerReplaceImage(${globalIdx}, 'back', event)" title="استبدال">+</button>
                            <button class="box-btn-copy-format" onclick="copyCardFormat(${globalIdx}, 'back', event)" title="نسخ التنسيق">🎨 نسخ</button>
                            ${extraPasteBtn}
                        `;
                        backBox.ondblclick = () => openCropper(globalIdx, 'back');
                        initDirectTouch(backBox, globalIdx, 'back');
                    } else {
                        let extraPasteBtn = '';
                        if (copiedFormatData && cardsData[globalIdx].backOrigData) {
                            extraPasteBtn = `<button class="box-btn-paste-format" onclick="pasteCardFormat(${globalIdx}, 'back', event)">📌 لصق التنسيق</button>`;
                        }
                        backBox.innerHTML = `<span>ظهر البطاقة</span>${extraPasteBtn}`;
                    }

                    row.appendChild(frontBox);
                    row.appendChild(backBox);
                    sheet.appendChild(row);
                }

                wrapper.appendChild(toolbar);
                wrapper.appendChild(sheet);
                container.appendChild(wrapper);
            }

            if (cardsData.some(i => i.frontCropped || i.backCropped)) {
                clearSection.innerHTML = `<button class="btn-clear-all" onclick="clearAllData()">🗑️ مسح الكل والبدء من جديد</button>`;
            }
        }

        async function exportSheet(sheetId, pageNum, shareWA) {
            const el = document.getElementById(sheetId);
            const hints = el.querySelectorAll('.tap-hint');
            const dels = el.querySelectorAll('.box-btn-del');
            const reps = el.querySelectorAll('.box-btn-replace');
            const copies = el.querySelectorAll('.box-btn-copy-format');
            const pastes = el.querySelectorAll('.box-btn-paste-format');

            hints.forEach(h => h.style.display = 'none');
            dels.forEach(d => d.style.display = 'none');
            reps.forEach(re => re.style.display = 'none');
            copies.forEach(c => c.style.display = 'none');
            pastes.forEach(p => p.style.display = 'none');

            try {
                const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff', useCORS: true });
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], `بطاقات_ورقة_${pageNum}.jpg`, { type: 'image/jpeg' });
                    if (shareWA && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: `ورقة طباعة ${pageNum}` });
                    } else {
                        const link = document.createElement('a');
                        link.download = file.name;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }
                }, 'image/jpeg', 0.96);
            } catch (err) {
                alert('حدث خطأ أثناء التصدير، يمكنك استخدام زر طباعة PDF.');
            } finally {
                hints.forEach(h => h.style.display = 'block');
                dels.forEach(d => d.style.display = 'flex');
                reps.forEach(re => re.style.display = 'flex');
                copies.forEach(c => c.style.display = 'block');
                pastes.forEach(p => p.style.display = 'block');
            }
        }
    </script>
</body>
</html>
