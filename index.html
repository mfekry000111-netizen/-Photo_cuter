        function buildRotatedFullResCanvas(img, totalDegrees) {
            const rad = (totalDegrees * Math.PI) / 180;
            const sin = Math.abs(Math.sin(rad));
            const cos = Math.abs(Math.cos(rad));
            const newW = Math.max(1, Math.round(img.naturalWidth * cos + img.naturalHeight * sin));
            const newH = Math.max(1, Math.round(img.naturalWidth * sin + img.naturalHeight * cos));

            const offCanvas = document.createElement('canvas');
            offCanvas.width = newW;
            offCanvas.height = newH;
            const offCtx = offCanvas.getContext('2d');
            offCtx.imageSmoothingEnabled = true;
            offCtx.imageSmoothingQuality = 'high';

            offCtx.translate(newW / 2, newH / 2);
            offCtx.rotate(rad);
            offCtx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
            return offCanvas;
        }

        function applyCamScannerEnhanceFilter(canvasEl) {
            const w = canvasEl.width;
            const h = canvasEl.height;
            const ctx2d = canvasEl.getContext('2d');
            const imgData = ctx2d.getImageData(0, 0, w, h);
            const d = imgData.data;

            for (let i = 0; i < d.length; i += 4) {
                const r = d[i], g = d[i + 1], b = d[i + 2];
                const lum = 0.299 * r + 0.587 * g + 0.114 * b;

                if (lum > 125) {
                    const t = Math.min(1, (lum - 125) / 130);
                    const lift = 195 + t * 60;
                    const delta = lift - lum;
                    d[i] = Math.min(255, Math.max(0, Math.round(r + delta * 0.98)));
                    d[i + 1] = Math.min(255, Math.max(0, Math.round(g + delta * 0.98)));
                    d[i + 2] = Math.min(255, Math.max(0, Math.round(b + delta * 0.98)));
                } else {
                    const contrast = 1.32;
                    const bright = 14;
                    d[i] = Math.max(0, Math.min(255, Math.round((r - 128) * contrast + 128 + bright)));
                    d[i + 1] = Math.max(0, Math.min(255, Math.round((g - 128) * contrast + 128 + bright)));
                    d[i + 2] = Math.max(0, Math.min(255, Math.round((b - 128) * contrast + 128 + bright)));
                }
            }

            ctx2d.putImageData(imgData, 0, 0);
        }

        function enhanceDataUrlForPrint(dataUrl) {
            return new Promise((resolve) => {
                if (!dataUrl) {
                    resolve(dataUrl);
                    return;
                }
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = img.naturalWidth || img.width;
                    c.height = img.naturalHeight || img.height;
                    const cCtx = c.getContext('2d');
                    cCtx.drawImage(img, 0, 0);
                    applyCamScannerEnhanceFilter(c);
                    resolve(c.toDataURL('image/jpeg', 0.97));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        async function globalEnhanceAllCards() {
            const btn = document.getElementById('globalEnhanceBtn');
            let count = 0;

            for (let i = 0; i < cardsData.length; i++) {
                const item = cardsData[i];
                if (item.frontCropped) {
                    item.frontCropped = await enhanceDataUrlForPrint(item.frontCropped);
                    count++;
                }
                if (item.backCropped) {
                    item.backCropped = await enhanceDataUrlForPrint(item.backCropped);
                    count++;
                }
            }

            if (count === 0) {
                alert('⚠️ لا توجد صور في الورقة لتحسينها.');
                return;
            }

            if (btn) {
                btn.classList.add('busy');
                btn.innerText = '✨ تم التحسين';
                setTimeout(() => {
                    btn.classList.remove('busy');
                    btn.innerText = '✨ تحسين';
                }, 1200);
            }

            saveToStorage();
            renderSheets();
        }

        function extractQuadCrop(sourceCanvas, quad, keepOriginalRatio = false, applyEnhance = true) {
            const full = isFullQuad(quad);
            const outCanvas = document.createElement('canvas');
            const outCtx = outCanvas.getContext('2d');
            outCtx.imageSmoothingEnabled = true;
            outCtx.imageSmoothingQuality = 'high';

            if (full) {
                outCanvas.width = sourceCanvas.width;
                outCanvas.height = sourceCanvas.height;
                outCtx.drawImage(sourceCanvas, 0, 0);
                if (applyEnhance) {
                    applyCamScannerEnhanceFilter(outCanvas);
                }
                return outCanvas.toDataURL('image/jpeg', 0.97);
            }

            const wPx = sourceCanvas.width;
            const hPx = sourceCanvas.height;

            const tl = { x: quad.tl.x * wPx, y: quad.tl.y * hPx };
            const tr = { x: quad.tr.x * wPx, y: quad.tr.y * hPx };
            const br = { x: quad.br.x * wPx, y: quad.br.y * hPx };
            const bl = { x: quad.bl.x * wPx, y: quad.bl.y * hPx };

            const topW = Math.hypot(tr.x - tl.x, tr.y - tl.y);
            const botW = Math.hypot(br.x - bl.x, br.y - bl.y);
            const leftH = Math.hypot(bl.x - tl.x, bl.y - tl.y);
            const rightH = Math.hypot(br.x - tr.x, br.y - tr.y);

            const natW = Math.max(50, Math.round((topW + botW) / 2));
            const natH = Math.max(50, Math.round((leftH + rightH) / 2));

            const targetW = keepOriginalRatio ? natW : Math.max(natW, 1280);
            const targetH = keepOriginalRatio ? natH : Math.max(1, Math.round(targetW * (natH / natW)));

            const sCtx = sourceCanvas.getContext('2d');
            const srcData = sCtx.getImageData(0, 0, wPx, hPx).data;

            outCanvas.width = targetW;
            outCanvas.height = targetH;
            const outImgData = outCtx.createImageData(targetW, targetH);
            const dstData = outImgData.data;

            for (let dy = 0; dy < targetH; dy++) {
                const v = dy / Math.max(1, targetH - 1);
                const lx = tl.x + (bl.x - tl.x) * v;
                const ly = tl.y + (bl.y - tl.y) * v;
                const rx = tr.x + (br.x - tr.x) * v;
                const ry = tr.y + (br.y - tr.y) * v;

                for (let dx = 0; dx < targetW; dx++) {
                    const u = dx / Math.max(1, targetW - 1);
                    const sx = lx + (rx - lx) * u;
                    const sy = ly + (ry - ly) * u;

                    const x0 = Math.max(0, Math.min(wPx - 1, Math.floor(sx)));
                    const y0 = Math.max(0, Math.min(hPx - 1, Math.floor(sy)));
                    const x1 = Math.max(0, Math.min(wPx - 1, x0 + 1));
                    const y1 = Math.max(0, Math.min(hPx - 1, y0 + 1));

                    const fx = sx - x0;
                    const fy = sy - y0;

                    const i00 = (y0 * wPx + x0) * 4;
                    const i10 = (y0 * wPx + x1) * 4;
                    const i01 = (y1 * wPx + x0) * 4;
                    const i11 = (y1 * wPx + x1) * 4;

                    const dIdx = (dy * targetW + dx) * 4;
                    for (let c = 0; c < 3; c++) {
                        const topVal = srcData[i00 + c] * (1 - fx) + srcData[i10 + c] * fx;
                        const botVal = srcData[i01 + c] * (1 - fx) + srcData[i11 + c] * fx;
                        dstData[dIdx + c] = Math.round(topVal * (1 - fy) + botVal * fy);
                    }
                    dstData[dIdx + 3] = 255;
                }
            }

            outCtx.putImageData(outImgData, 0, 0);

            if (applyEnhance) {
                applyCamScannerEnhanceFilter(outCanvas);
            }

            return outCanvas.toDataURL('image/jpeg', 0.97);
        }

        function recomputeCroppedImage(item, side, onDoneCallback = null) {
            const origImg = side === 'front' ? item.frontOriginal : item.backOriginal;
            const origData = side === 'front' ? item.frontOrigData : item.backOrigData;
            const quad = side === 'front' ? item.frontQuad : item.backQuad;
            const rot = side === 'front' ? item.frontRot : item.backRot;

            if (!origData) return;

            const applyFromImg = (imgEl) => {
                const full = isFullQuad(quad);
                const rotCanvas = buildRotatedFullResCanvas(imgEl, (rot ? rot.base + rot.fine : 0));
                const newUrl = extractQuadCrop(rotCanvas, quad, full, true);
                if (side === 'front') item.frontCropped = newUrl;
                else item.backCropped = newUrl;
                saveToStorage();
                if (typeof onDoneCallback === 'function') {
                    onDoneCallback(newUrl);
                } else {
                    renderSheets();
                }
            };

            if (origImg && origImg.complete && origImg.naturalWidth > 0) {
                applyFromImg(origImg);
            } else {
                const tempImg = new Image();
                tempImg.onload = () => {
                    if (side === 'front') item.frontOriginal = tempImg;
                    else item.backOriginal = tempImg;
                    applyFromImg(tempImg);
                };
                tempImg.src = origData;
            }
        }

        function updatePasteButtonState() {
            const pasteBtn = document.getElementById('globalPasteBtn');
            if (!pasteBtn) return;
            if (copiedFormat) {
                pasteBtn.classList.add('ready');
                pasteBtn.innerText = '📌 لصق لغير المقصوص';
            } else {
                pasteBtn.classList.remove('ready');
                pasteBtn.innerText = '📌 لصق التنسيق';
            }
        }

        function globalCopyFormat() {
            let sourceItem = null;
            let sourceSide = null;

            for (let i = 0; i < cardsData.length; i++) {
                if (cardsData[i].frontCropped) {
                    sourceItem = cardsData[i];
                    sourceSide = 'front';
                    break;
                } else if (cardsData[i].backCropped) {
                    sourceItem = cardsData[i];
                    sourceSide = 'back';
                    break;
                }
            }

            if (!sourceItem) {
                alert('⚠️ لا توجد بطاقة لنسخ تنسيقها.');
                return;
            }

            copiedFormat = {
                quad: cloneQuad(sourceSide === 'front' ? sourceItem.frontQuad : sourceItem.backQuad),
                rot: JSON.parse(JSON.stringify(sourceSide === 'front' ? sourceItem.frontRot : sourceItem.backRot))
            };

            updatePasteButtonState();
            alert('🎨 تم نسخ التنسيق! لن يتم تطبيقه على البطاقات المقصوصة أصلاً.');
        }

        function globalPasteFormat() {
            if (!copiedFormat) {
                alert('⚠️ اضغط على (نسخ التنسيق) أولاً.');
                return;
            }

            let appliedCount = 0;
            let skippedCroppedCount = 0;

            const tryApplyToSlot = (item, side) => {
                const origData = side === 'front' ? item.frontOrigData : item.backOrigData;
                if (!origData) return;

                const alreadyCropped = side === 'front'
                    ? (item.frontIsCropped || !isFullQuad(item.frontQuad))
                    : (item.backIsCropped || !isFullQuad(item.backQuad));

                if (alreadyCropped) {
                    skippedCroppedCount++;
                    return;
                }

                if (side === 'front') {
                    item.frontQuad = cloneQuad(copiedFormat.quad);
                    item.frontRot = JSON.parse(JSON.stringify(copiedFormat.rot));
                    item.frontIsCropped = !isFullQuad(item.frontQuad);
                    recomputeCroppedImage(item, 'front');
                } else {
                    item.backQuad = cloneQuad(copiedFormat.quad);
                    item.backRot = JSON.parse(JSON.stringify(copiedFormat.rot));
                    item.backIsCropped = !isFullQuad(item.backQuad);
                    recomputeCroppedImage(item, 'back');
                }
                appliedCount++;
            };

            cardsData.forEach(item => {
                tryApplyToSlot(item, 'front');
                tryApplyToSlot(item, 'back');
            });

            if (appliedCount === 0) {
                alert(skippedCroppedCount > 0
                    ? 'ℹ️ تم تجاهل البطاقات المقصوصة أصلاً ولم يتم تغييرها.'
                    : '⚠️ لم يتم العثور على صور غير مقصوصة لتطبيق التنسيق عليها.');
                return;
            }

            alert(`✅ تم تطبيق التنسيق على (${appliedCount}) صورة غير مقصوصة (وتم استثناء المقصوصة أصلاً).`);
            renderSheets();
        }

        function placeImageIntoSlots(img, dataUrl) {
            const alreadyCard = isAlreadyCroppedCard(img);
            const autoAngle = alreadyCard ? 0 : detectAutoOrientationAngle(img);
            const fullCanvas = alreadyCard ? null : buildRotatedFullResCanvas(img, autoAngle);
            const chosenQuad = alreadyCard ? cloneQuad(FULL_QUAD) : detectCardQuad(fullCanvas);
            const wasCropped = alreadyCard ? false : (!isFullQuad(chosenQuad) || autoAngle !== 0);
            const resultUrl = alreadyCard ? dataUrl : extractQuadCrop(fullCanvas, chosenQuad, false, true);

            let placed = false;
            for (let i = 0; i < cardsData.length; i++) {
                if (!cardsData[i].frontCropped) {
                    cardsData[i].frontOriginal = img;
                    cardsData[i].frontOrigData = dataUrl;
                    cardsData[i].frontCropped = resultUrl;
                    cardsData[i].frontQuad = cloneQuad(chosenQuad);
                    cardsData[i].frontRot = { base: autoAngle, fine: 0 };
                    cardsData[i].frontIsCropped = wasCropped;
                    cardsData[i].frontView = { scale: 1, tx: 0, ty: 0 };
                    placed = true;
                    break;
                } else if (!cardsData[i].backCropped) {
                    cardsData[i].backOriginal = img;
                    cardsData[i].backOrigData = dataUrl;
                    cardsData[i].backCropped = resultUrl;
                    cardsData[i].backQuad = cloneQuad(chosenQuad);
                    cardsData[i].backRot = { base: autoAngle, fine: 0 };
                    cardsData[i].backIsCropped = wasCropped;
                    cardsData[i].backView = { scale: 1, tx: 0, ty: 0 };
                    placed = true;
                    break;
                }
            }

            if (!placed) {
                const newRow = createEmptyRow();
                newRow.frontOriginal = img;
                newRow.frontOrigData = dataUrl;
                newRow.frontCropped = resultUrl;
                newRow.frontQuad = cloneQuad(chosenQuad);
                newRow.frontRot = { base: autoAngle, fine: 0 };
                newRow.frontIsCropped = wasCropped;
                newRow.frontView = { scale: 1, tx: 0, ty: 0 };
                cardsData.push(newRow);
            }
        }

        document.getElementById('galleryInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;

            let loadedCount = 0;
            const loadedImages = new Array(files.length);

            files.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        loadedImages[index] = { img: img, dataUrl: ev.target.result };
                        loadedCount++;

                        if (loadedCount === files.length) {
                            loadedImages.forEach(entry => {
                                if (entry) placeImageIntoSlots(entry.img, entry.dataUrl);
                            });

                            ensureEmptySlots();
                            saveToStorage();
                            renderSheets();
                        }
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });
            this.value = '';
        });

        function openCropper(rowIndex, side, event) {
            if (suppressNextClick) {
                suppressNextClick = false;
                return;
            }
            if (event) event.stopPropagation();
            const item = cardsData[rowIndex];
            if (!item || !(side === 'front' ? item.frontCropped : item.backCropped)) return;

            activeRowIndex = rowIndex;
            activeSide = side;
            enhanceEnabled = true;
            loupeScreenPos = null;
            document.getElementById('enhanceLabel').innerText = 'وضع: تحسين';
            document.getElementById('csResultPreview').style.display = 'none';
            document.getElementById('csProcessing').style.display = 'none';

            let imgObj = side === 'front' ? item.frontOriginal : item.backOriginal;
            const origData = side === 'front' ? item.frontOrigData : item.backOrigData;
            const savedQuad = side === 'front' ? item.frontQuad : item.backQuad;
            const savedRot = side === 'front' ? item.frontRot : item.backRot;

            const startWithImage = (loadedImg) => {
                rawOriginalImage = loadedImg;
                base90Angle = (savedRot && typeof savedRot.base === 'number') ? savedRot.base : detectAutoOrientationAngle(loadedImg);

                rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, base90Angle);

                if (savedQuad && !isFullQuad(savedQuad)) {
                    cropQuad = cloneQuad(savedQuad);
                    setEdgeModeButton('card');
                } else if (!isAlreadyCroppedCard(loadedImg)) {
                    cropQuad = detectCardQuad(rotatedCanvas);
                    setEdgeModeButton('card');
                } else {
                    cropQuad = cloneQuad(FULL_QUAD);
                    setEdgeModeButton('contract');
                }

                setActiveBottomTool('btnAuto');
                document.getElementById('cropperModal').style.display = 'flex';
                resizeCanvasToWorkspace();
                renderCropperCanvas();
            };

            if (imgObj && imgObj.complete && imgObj.naturalWidth > 0) {
                startWithImage(imgObj);
            } else if (origData) {
                const tempImg = new Image();
                tempImg.onload = () => {
                    if (side === 'front') item.frontOriginal = tempImg;
                    else item.backOriginal = tempImg;
                    startWithImage(tempImg);
                };
                tempImg.src = origData;
            }
        }

        function closeCropper() {
            loupeScreenPos = null;
            document.getElementById('cropperModal').style.display = 'none';
            document.getElementById('csResultPreview').style.display = 'none';
            document.getElementById('csProcessing').style.display = 'none';
        }

        function resizeCanvasToWorkspace() {
            cssCanvasW = Math.max(100, workspace.clientWidth);
            cssCanvasH = Math.max(100, workspace.clientHeight);
            const dpr = Math.min(window.devicePixelRatio || 1, 3);
            canvas.width = Math.round(cssCanvasW * dpr);
            canvas.height = Math.round(cssCanvasH * dpr);
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('cropperModal').style.display === 'flex') {
                resizeCanvasToWorkspace();
                renderCropperCanvas();
            }
        });

        function getBaseImageRect() {
            if (!rotatedCanvas) return { x: 0, y: 0, w: 100, h: 100 };
            const pad = 12;
            const availW = Math.max(50, cssCanvasW - pad * 2);
            const availH = Math.max(50, cssCanvasH - pad * 2);
            const scale = Math.min(availW / rotatedCanvas.width, availH / rotatedCanvas.height);
            const w = rotatedCanvas.width * scale;
            const h = rotatedCanvas.height * scale;
            return {
                x: (cssCanvasW - w) / 2,
                y: (cssCanvasH - h) / 2,
                w: w,
                h: h
            };
        }

        function quadToScreen(q, base) {
            return {
                tl: { x: base.x + q.tl.x * base.w, y: base.y + q.tl.y * base.h },
                tr: { x: base.x + q.tr.x * base.w, y: base.y + q.tr.y * base.h },
                br: { x: base.x + q.br.x * base.w, y: base.y + q.br.y * base.h },
                bl: { x: base.x + q.bl.x * base.w, y: base.y + q.bl.y * base.h }
            };
        }

        function drawCamScannerLoupe(base, targetScreenPt) {
            if (!loupeScreenPos || !targetScreenPt || !rotatedCanvas) return;

            const radius = 58;
            const zoom = 2.3;

            let lx = loupeScreenPos.x;
            let ly = loupeScreenPos.y - 105;
            lx = Math.max(radius + 10, Math.min(cssCanvasW - radius - 10, lx));
            if (ly < radius + 10) {
                ly = Math.min(cssCanvasH - radius - 10, loupeScreenPos.y + 105);
            }

            const normX = (targetScreenPt.x - base.x) / base.w;
            const normY = (targetScreenPt.y - base.y) / base.h;
            const srcX = normX * rotatedCanvas.width;
            const srcY = normY * rotatedCanvas.height;

            const sampleW = (radius * 2) / zoom * (rotatedCanvas.width / base.w);
            const sampleH = (radius * 2) / zoom * (rotatedCanvas.height / base.h);

            ctx.save();
            ctx.beginPath();
            ctx.arc(lx, ly, radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.clip();

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(
                rotatedCanvas,
                srcX - sampleW / 2,
                srcY - sampleH / 2,
                sampleW,
                sampleH,
                lx - radius,
                ly - radius,
                radius * 2,
                radius * 2
            );

            ctx.strokeStyle = 'rgba(22, 163, 74, 0.75)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(lx - 12, ly);
            ctx.lineTo(lx + 12, ly);
            ctx.moveTo(lx, ly - 12);
            ctx.lineTo(lx, ly + 12);
            ctx.stroke();

            ctx.restore();

            ctx.save();
            ctx.beginPath();
            ctx.arc(lx, ly, radius, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#ffffff';
            ctx.stroke();
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#16a34a';
            ctx.stroke();
            ctx.restore();
        }

        function renderCropperCanvas() {
            if (!rotatedCanvas) return;
            const dpr = canvas.width / Math.max(1, cssCanvasW);

            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, cssCanvasW, cssCanvasH);

            const base = getBaseImageRect();

            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(rotatedCanvas, base.x, base.y, base.w, base.h);

            const sp = quadToScreen(cropQuad, base);

            ctx.fillStyle = 'rgba(17, 24, 39, 0.36)';
            ctx.beginPath();
            ctx.rect(0, 0, cssCanvasW, cssCanvasH);
            ctx.moveTo(sp.tl.x, sp.tl.y);
            ctx.lineTo(sp.bl.x, sp.bl.y);
            ctx.lineTo(sp.br.x, sp.br.y);
            ctx.lineTo(sp.tr.x, sp.tr.y);
            ctx.closePath();
            ctx.fill('evenodd');

            ctx.strokeStyle = '#16a34a';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sp.tl.x, sp.tl.y);
            ctx.lineTo(sp.tr.x, sp.tr.y);
            ctx.lineTo(sp.br.x, sp.br.y);
            ctx.lineTo(sp.bl.x, sp.bl.y);
            ctx.closePath();
            ctx.stroke();

            const tm = { x: (sp.tl.x + sp.tr.x) / 2, y: (sp.tl.y + sp.tr.y) / 2 };
            const bm = { x: (sp.bl.x + sp.br.x) / 2, y: (sp.bl.y + sp.br.y) / 2 };
            const lm = { x: (sp.tl.x + sp.bl.x) / 2, y: (sp.tl.y + sp.bl.y) / 2 };
            const rm = { x: (sp.tr.x + sp.br.x) / 2, y: (sp.tr.y + sp.br.y) / 2 };

            const knobs = [sp.tl, sp.tr, sp.br, sp.bl, tm, bm, lm, rm];
            knobs.forEach((pt, idx) => {
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, idx < 4 ? 8.5 : 6.5, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#16a34a';
                ctx.stroke();
            });

            if (activeHandle && activeHandle !== 'move' && loupeScreenPos) {
                const handlePtMap = {
                    tl: sp.tl, tr: sp.tr, br: sp.br, bl: sp.bl,
                    t: tm, b: bm, l: lm, r: rm
                };
                drawCamScannerLoupe(base, handlePtMap[activeHandle] || loupeScreenPos);
            }

            ctx.restore();
        }

        function screenToImageNorm(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const sx = clientX - rect.left;
            const sy = clientY - rect.top;
            const base = getBaseImageRect();

            return {
                x: (sx - base.x) / base.w,
                y: (sy - base.y) / base.h,
                sx: sx,
                sy: sy
            };
        }

        function pointInQuad(px, py, q) {
            const poly = [q.tl, q.tr, q.br, q.bl];
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y;
                const xj = poly[j].x, yj = poly[j].y;
                const intersect = ((yi > py) !== (yj > py)) &&
                    (px < ((xj - xi) * (py - yi)) / ((yj - yi) || 1e-9) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function onTouchStart(e) {
            if (document.getElementById('csResultPreview').style.display === 'flex') return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = screenToImageNorm(clientX, clientY);
            const base = getBaseImageRect();
            const sp = quadToScreen(cropQuad, base);

            const tm = { x: (sp.tl.x + sp.tr.x) / 2, y: (sp.tl.y + sp.tr.y) / 2 };
            const bm = { x: (sp.bl.x + sp.br.x) / 2, y: (sp.bl.y + sp.br.y) / 2 };
            const lm = { x: (sp.tl.x + sp.bl.x) / 2, y: (sp.tl.y + sp.bl.y) / 2 };
            const rm = { x: (sp.tr.x + sp.br.x) / 2, y: (sp.tr.y + sp.br.y) / 2 };

            const handles = [
                { name: 'tl', x: sp.tl.x, y: sp.tl.y, r: 46 },
                { name: 'tr', x: sp.tr.x, y: sp.tr.y, r: 46 },
                { name: 'br', x: sp.br.x, y: sp.br.y, r: 46 },
                { name: 'bl', x: sp.bl.x, y: sp.bl.y, r: 46 },
                { name: 't',  x: tm.x, y: tm.y, r: 34 },
                { name: 'b',  x: bm.x, y: bm.y, r: 34 },
                { name: 'l',  x: lm.x, y: lm.y, r: 34 },
                { name: 'r',  x: rm.x, y: rm.y, r: 34 }
            ];

            let closest = null;
            let minDist = Infinity;
            handles.forEach(h => {
                const d = Math.hypot(pt.sx - h.x, pt.sy - h.y);
                if (d <= h.r && d < minDist) {
                    minDist = d;
                    closest = h.name;
                }
            });

            if (closest) {
                activeHandle = closest;
                loupeScreenPos = { x: pt.sx, y: pt.sy };
            } else if (pointInQuad(pt.sx, pt.sy, sp)) {
                activeHandle = 'move';
                loupeScreenPos = null;
            } else {
                activeHandle = null;
                loupeScreenPos = null;
                return;
            }

            dragStart = { x: pt.x, y: pt.y };
            initialQuad = cloneQuad(cropQuad);
            renderCropperCanvas();
        }

        function onTouchMove(e) {
            if (!activeHandle || !initialQuad) return;
            e.preventDefault();

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const pt = screenToImageNorm(clientX, clientY);

            const dx = pt.x - dragStart.x;
            const dy = pt.y - dragStart.y;
            const q = cloneQuad(initialQuad);

            if (activeHandle === 'move') {
                cropQuad = shiftQuadClamped(q, dx, dy);
            } else if (['tl', 'tr', 'br', 'bl'].includes(activeHandle)) {
                q[activeHandle].x = clamp01(q[activeHandle].x + dx);
                q[activeHandle].y = clamp01(q[activeHandle].y + dy);
                loupeScreenPos = { x: pt.sx, y: pt.sy };
                cropQuad = q;
            } else if (activeHandle === 't') {
                q.tl.y = clamp01(q.tl.y + dy);
                q.tr.y = clamp01(q.tr.y + dy);
                loupeScreenPos = { x: pt.sx, y: pt.sy };
                cropQuad = q;
            } else if (activeHandle === 'b') {
                q.bl.y = clamp01(q.bl.y + dy);
                q.br.y = clamp01(q.br.y + dy);
                loupeScreenPos = { x: pt.sx, y: pt.sy };
                cropQuad = q;
            } else if (activeHandle === 'l') {
                q.tl.x = clamp01(q.tl.x + dx);
                q.bl.x = clamp01(q.bl.x + dx);
                loupeScreenPos = { x: pt.sx, y: pt.sy };
                cropQuad = q;
            } else if (activeHandle === 'r') {
                q.tr.x = clamp01(q.tr.x + dx);
                q.br.x = clamp01(q.br.x + dx);
                loupeScreenPos = { x: pt.sx, y: pt.sy };
                cropQuad = q;
            }

            renderCropperCanvas();
        }

        function onTouchEnd() {
            activeHandle = null;
            initialQuad = null;
            loupeScreenPos = null;
            if (document.getElementById('cropperModal').style.display === 'flex') {
                renderCropperCanvas();
            }
        }

        canvas.addEventListener('mousedown', onTouchStart);
        canvas.addEventListener('touchstart', onTouchStart, { passive: false });
        window.addEventListener('mousemove', onTouchMove);
        window.addEventListener('touchmove', onTouchMove, { passive: false });
        window.addEventListener('mouseup', onTouchEnd);
        window.addEventListener('touchend', onTouchEnd);

        function rotate90(delta) {
            setActiveBottomTool(delta > 0 ? 'btnRight' : 'btnLeft');
            base90Angle = (base90Angle + delta + 360) % 360;
            if (!rawOriginalImage) return;
            rotatedCanvas = buildRotatedFullResCanvas(rawOriginalImage, base90Angle);
            cropQuad = detectCardQuad(rotatedCanvas);
            setEdgeModeButton('card');
            renderCropperCanvas();
        }

        function confirmCropAndPreview() {
            if (activeRowIndex === -1 || !rotatedCanvas) return;

            const proc = document.getElementById('csProcessing');
            proc.style.display = 'flex';

            setTimeout(() => {
                const full = isFullQuad(cropQuad);
                pendingResultUrl = extractQuadCrop(rotatedCanvas, cropQuad, full, enhanceEnabled);
                document.getElementById('csPreviewImg').src = pendingResultUrl;
                proc.style.display = 'none';
                document.getElementById('csResultPreview').style.display = 'flex';
            }, 140);
        }

        function togglePreviewEnhance() {
            if (!rotatedCanvas) return;
            enhanceEnabled = !enhanceEnabled;
            document.getElementById('enhanceLabel').innerText = enhanceEnabled ? 'وضع: تحسين' : 'وضع: الأصل';
            const full = isFullQuad(cropQuad);
            pendingResultUrl = extractQuadCrop(rotatedCanvas, cropQuad, full, enhanceEnabled);
            document.getElementById('csPreviewImg').src = pendingResultUrl;
        }

        function backToCropBox() {
            document.getElementById('csResultPreview').style.display = 'none';
            renderCropperCanvas();
        }

        function finalizeResultToSheet() {
            if (activeRowIndex === -1 || !rotatedCanvas) return;
            const item = cardsData[activeRowIndex];
            const full = isFullQuad(cropQuad);
            const finalUrl = pendingResultUrl || extractQuadCrop(rotatedCanvas, cropQuad, full, enhanceEnabled);

            if (activeSide === 'front') {
                item.frontCropped = finalUrl;
                item.frontQuad = cloneQuad(cropQuad);
                item.frontRot = { base: base90Angle, fine: 0 };
                item.frontIsCropped = !full;
                item.frontView = { scale: 1, tx: 0, ty: 0 };
            } else {
                item.backCropped = finalUrl;
                item.backQuad = cloneQuad(cropQuad);
                item.backRot = { base: base90Angle, fine: 0 };
                item.backIsCropped = !full;
                item.backView = { scale: 1, tx: 0, ty: 0 };
            }

            closeCropper();
            saveToStorage();
            renderSheets();
        }

        function deleteSingleImage(rowIndex, side, event) {
            event.stopPropagation();
            const item = cardsData[rowIndex];
            if (!item) return;

            if (pendingMoveSource && pendingMoveSource.rowIndex === rowIndex && pendingMoveSource.side === side) {
                pendingMoveSource = null;
            }
            selectedSlots.delete(getSlotKey(rowIndex, side));

            if (side === 'front') {
                item.frontOriginal = null;
                item.frontOrigData = null;
                item.frontCropped = null;
                item.frontQuad = cloneQuad(FULL_QUAD);
                item.frontRot = { base: 0, fine: 0 };
                item.frontIsCropped = false;
                item.frontView = { scale: 1, tx: 0, ty: 0 };
            } else {
                item.backOriginal = null;
                item.backOrigData = null;
                item.backCropped = null;
                item.backQuad = cloneQuad(FULL_QUAD);
                item.backRot = { base: 0, fine: 0 };
                item.backIsCropped = false;
                item.backView = { scale: 1, tx: 0, ty: 0 };
            }

            ensureEmptySlots();
            saveToStorage();
            renderSheets();
        }

        function triggerReplaceImage(rowIndex, side, event) {
            event.stopPropagation();
            replaceTargetIndex = rowIndex;
            replaceTargetSide = side;
            document.getElementById('replaceInput').value = null;
            document.getElementById('replaceInput').click();
        }

        function handleReplaceFile(input) {
            const file = input.files[0];
            if (!file || replaceTargetIndex === -1 || !replaceTargetSide) return;

            const reader = new FileReader();
            reader.onload = function(ev) {
                const img = new Image();
                img.onload = function() {
                    const alreadyCard = isAlreadyCroppedCard(img);
                    const autoAngle = alreadyCard ? 0 : detectAutoOrientationAngle(img);
                    const fullCanvas = alreadyCard ? null : buildRotatedFullResCanvas(img, autoAngle);
                    const chosenQuad = alreadyCard ? cloneQuad(FULL_QUAD) : detectCardQuad(fullCanvas);
                    const wasCropped = alreadyCard ? false : (!isFullQuad(chosenQuad) || autoAngle !== 0);
                    const resultUrl = alreadyCard ? ev.target.result : extractQuadCrop(fullCanvas, chosenQuad, false, true);

                    const item = cardsData[replaceTargetIndex];
                    if (replaceTargetSide === 'front') {
                        item.frontOriginal = img;
                        item.frontOrigData = ev.target.result;
                        item.frontCropped = resultUrl;
                        item.frontQuad = cloneQuad(chosenQuad);
                        item.frontRot = { base: autoAngle, fine: 0 };
                        item.frontIsCropped = wasCropped;
                        item.frontView = { scale: 1, tx: 0, ty: 0 };
                    } else {
                        item.backOriginal = img;
                        item.backOrigData = ev.target.result;
                        item.backCropped = resultUrl;
                        item.backQuad = cloneQuad(chosenQuad);
                        item.backRot = { base: autoAngle, fine: 0 };
                        item.backIsCropped = wasCropped;
                        item.backView = { scale: 1, tx: 0, ty: 0 };
                    }

                    ensureEmptySlots();
                    saveToStorage();
                    renderSheets();
                    replaceTargetIndex = -1;
                    replaceTargetSide = null;
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        }

        function moveOrSwapSlots(srcRowIndex, srcSide, targetRowIndex, targetSide) {
            if (srcRowIndex === targetRowIndex && srcSide === targetSide) return;

            while (cardsData.length <= Math.max(srcRowIndex, targetRowIndex)) {
                cardsData.push(createEmptyRow());
            }

            const srcItem = cardsData[srcRowIndex];
            const targetItem = cardsData[targetRowIndex];

            const extractSlot = (item, side) => side === 'front' ? {
                original: item.frontOriginal,
                origData: item.frontOrigData,
                cropped: item.frontCropped,
                quad: cloneQuad(item.frontQuad || FULL_QUAD),
                rot: JSON.parse(JSON.stringify(item.frontRot || { base: 0, fine: 0 })),
                isCropped: !!item.frontIsCropped,
                view: JSON.parse(JSON.stringify(item.frontView || { scale: 1, tx: 0, ty: 0 }))
            } : {
                original: item.backOriginal,
                origData: item.backOrigData,
                cropped: item.backCropped,
                quad: cloneQuad(item.backQuad || FULL_QUAD),
                rot: JSON.parse(JSON.stringify(item.backRot || { base: 0, fine: 0 })),
                isCropped: !!item.backIsCropped,
                view: JSON.parse(JSON.stringify(item.backView || { scale: 1, tx: 0, ty: 0 }))
            };

            const assignSlot = (item, side, data) => {
                if (side === 'front') {
                    item.frontOriginal = data.original;
                    item.frontOrigData = data.origData;
                    item.frontCropped = data.cropped;
                    item.frontQuad = data.quad;
                    item.frontRot = data.rot;
                    item.frontIsCropped = data.isCropped;
                    item.frontView = data.view;
                } else {
                    item.backOriginal = data.original;
                    item.backOrigData = data.origData;
                    item.backCropped = data.cropped;
                    item.backQuad = data.quad;
                    item.backRot = data.rot;
                    item.backIsCropped = data.isCropped;
                    item.backView = data.view;
                }
            };

            const emptySlot = {
                original: null,
                origData: null,
                cropped: null,
                quad: cloneQuad(FULL_QUAD),
                rot: { base: 0, fine: 0 },
                isCropped: false,
                view: { scale: 1, tx: 0, ty: 0 }
            };

            const srcSlot = extractSlot(srcItem, srcSide);
            const targetSlot = extractSlot(targetItem, targetSide);

            if (!srcSlot.cropped) return;

            if (!targetSlot.cropped) {
                assignSlot(targetItem, targetSide, srcSlot);
                assignSlot(srcItem, srcSide, emptySlot);
            } else {
                assignSlot(targetItem, targetSide, srcSlot);
                assignSlot(srcItem, srcSide, targetSlot);
            }

            pendingMoveSource = null;
            ensureEmptySlots();
            saveToStorage();
            renderSheets();
        }

        function clearTouchDragHighlights() {
            document.querySelectorAll('.id-box.drag-target-over, .id-box.drag-source').forEach(el => {
                el.classList.remove('drag-target-over');
                el.classList.remove('drag-source');
            });
            document.body.classList.remove('dragging-slot-active');
            const ghost = document.getElementById('touchDragGhost');
            if (ghost) ghost.style.display = 'none';
        }

        function findSlotBoxAtPoint(clientX, clientY) {
            const ghost = document.getElementById('touchDragGhost');
            const prevDisplay = ghost ? ghost.style.display : 'none';
            if (ghost) ghost.style.display = 'none';
            const el = document.elementFromPoint(clientX, clientY);
            if (ghost) ghost.style.display = prevDisplay;
            return el ? el.closest('.id-box') : null;
        }

        function attachTwoFingerAndTouchDrag(boxEl, rowIndex, side) {
            const getView = () => {
                const item = cardsData[rowIndex];
                if (!item) return { scale: 1, tx: 0, ty: 0 };
                if (side === 'front') {
                    if (!item.frontView) item.frontView = { scale: 1, tx: 0, ty: 0 };
                    return item.frontView;
                } else {
                    if (!item.backView) item.backView = { scale: 1, tx: 0, ty: 0 };
                    return item.backView;
                }
            };

            const applyTransformToImg = (v) => {
                const imgEl = boxEl.querySelector('img');
                if (imgEl) {
                    imgEl.style.transform = `translate(${v.tx}px, ${v.ty}px) scale(${v.scale})`;
                }
            };

            let longPressTimer = null;

            const cancelLongPress = () => {
                if (longPressTimer) {
                    clearTimeout(longPressTimer);
                    longPressTimer = null;
                }
            };

            boxEl.addEventListener('touchstart', (e) => {
                if (e.target.closest('button')) return;
                const v = getView();

                if (e.touches.length === 2) {
                    cancelLongPress();
                    if (touchDragState && touchDragState.dragging) {
                        clearTouchDragHighlights();
                        touchDragState = null;
                    }
                    e.preventDefault();
                    boxEl.classList.remove('nudging-active');
                    boxEl.classList.add('pinching-active');
                    const t1 = e.touches[0], t2 = e.touches[1];
                    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY) || 1;
                    const midX = (t1.clientX + t2.clientX) / 2;
                    const midY = (t1.clientY + t2.clientY) / 2;
                    slotGesture = {
                        mode: 'pinch',
                        rowIndex,
                        side,
                        startDist: dist,
                        startScale: v.scale,
                        startMidX: midX,
                        startMidY: midY,
                        startTx: v.tx,
                        startTy: v.ty,
                        boxEl
                    };
                    return;
                }

                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const item = cardsData[rowIndex];
                    const imgSrc = side === 'front' ? (item && item.frontCropped) : (item && item.backCropped);
                    const currentQuad = side === 'front'
                        ? cloneQuad((item && item.frontQuad) || FULL_QUAD)
                        : cloneQuad((item && item.backQuad) || FULL_QUAD);

                    touchDragState = {
                        rowIndex,
                        side,
                        startX: touch.clientX,
                        startY: touch.clientY,
                        lastX: touch.clientX,
                        lastY: touch.clientY,
                        imgSrc,
                        originQuad: currentQuad,
                        dragging: false,
                        nudging: false,
                        overBox: null
                    };

                    if (imgSrc) {
                        slotGesture = {
                            mode: 'nudge',
                            rowIndex,
                            side,
                            startX: touch.clientX,
                            startY: touch.clientY,
                            startTx: v.tx,
                            startTy: v.ty,
                            boxEl
                        };

                        longPressTimer = setTimeout(() => {
                            if (!touchDragState || touchDragState.rowIndex !== rowIndex || touchDragState.side !== side) return;
                            if (touchDragState.nudging) return;
                            if (slotGesture && slotGesture.mode === 'pinch') return;
                            slotGesture = null;
                            boxEl.classList.remove('nudging-active');
                            touchDragState.dragging = true;
                            suppressNextClick = true;
                            document.body.classList.add('dragging-slot-active');
                            boxEl.classList.add('drag-source');

                            const ghost = document.getElementById('touchDragGhost');
                            const ghostImg = document.getElementById('touchDragGhostImg');
                            if (ghost && ghostImg) {
                                ghostImg.src = imgSrc;
                                ghost.style.left = touchDragState.lastX + 'px';
                                ghost.style.top = touchDragState.lastY + 'px';
                                ghost.style.display = 'block';
                            }
                            if (navigator.vibrate) {
                                navigator.vibrate(25);
                            }
                        }, 450);
                    }
                }
            }, { passive: false });

            boxEl.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && slotGesture && slotGesture.mode === 'pinch' && slotGesture.rowIndex === rowIndex && slotGesture.side === side) {
                    e.preventDefault();
                    const v = getView();
                    const t1 = e.touches[0], t2 = e.touches[1];
                    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY) || 1;
                    const midX = (t1.clientX + t2.clientX) / 2;
                    const midY = (t1.clientY + t2.clientY) / 2;

                    const nextScale = Math.max(0.75, Math.min(3.5, slotGesture.startScale * (dist / slotGesture.startDist)));
                    v.scale = nextScale;
                    v.tx = slotGesture.startTx + (midX - slotGesture.startMidX);
                    v.ty = slotGesture.startTy + (midY - slotGesture.startMidY);
                    applyTransformToImg(v);
                    return;
                }

                if (e.touches.length === 1 && touchDragState && touchDragState.rowIndex === rowIndex && touchDragState.side === side) {
                    const touch = e.touches[0];
                    touchDragState.lastX = touch.clientX;
                    touchDragState.lastY = touch.clientY;
                    const movedDist = Math.hypot(touch.clientX - touchDragState.startX, touch.clientY - touchDragState.startY);

                    if (!touchDragState.dragging) {
                        if (movedDist > 7 && slotGesture && slotGesture.mode === 'nudge') {
                            e.preventDefault();
                            touchDragState.nudging = true;
                            suppressNextClick = true;
                            boxEl.classList.add('nudging-active');
                            const v = getView();
                            const slowFactor = 0.35;
                            const rawTx = slotGesture.startTx + (touch.clientX - slotGesture.startX) * slowFactor;
                            const rawTy = slotGesture.startTy + (touch.clientY - slotGesture.startY) * slowFactor;
                            v.tx = Math.max(-36, Math.min(36, rawTx));
                            v.ty = Math.max(-36, Math.min(36, rawTy));
                            applyTransformToImg(v);
                        }
                        return;
                    }

                    e.preventDefault();
                    const ghost = document.getElementById('touchDragGhost');
                    if (ghost) {
                        ghost.style.left = touch.clientX + 'px';
                        ghost.style.top = touch.clientY + 'px';
                    }

                    const targetBox = findSlotBoxAtPoint(touch.clientX, touch.clientY);
                    if (touchDragState.overBox && touchDragState.overBox !== targetBox) {
                        touchDragState.overBox.classList.remove('drag-target-over');
                    }
                    if (targetBox && targetBox !== boxEl) {
                        targetBox.classList.add('drag-target-over');
                        touchDragState.overBox = targetBox;
                    } else {
                        touchDragState.overBox = null;
                    }
                }
            }, { passive: false });

            const finishGesture = () => {
                cancelLongPress();

                if (touchDragState && touchDragState.rowIndex === rowIndex && touchDragState.side === side) {
                    const wasDragging = touchDragState.dragging;
                    const wasNudging = touchDragState.nudging;
                    const deltaPxX = touchDragState.lastX - touchDragState.startX;
                    const deltaPxY = touchDragState.lastY - touchDragState.startY;
                    const originQuad = touchDragState.originQuad;
                    const targetBox = touchDragState.overBox || findSlotBoxAtPoint(touchDragState.lastX, touchDragState.lastY);

                    clearTouchDragHighlights();
                    boxEl.classList.remove('nudging-active');
                    touchDragState = null;

                    if (wasDragging && targetBox && targetBox.dataset.rowIndex !== undefined && targetBox.dataset.side) {
                        const targetRow = parseInt(targetBox.dataset.rowIndex, 10);
                        const targetSide = targetBox.dataset.side;
                        moveOrSwapSlots(rowIndex, side, targetRow, targetSide);
                        setTimeout(() => { suppressNextClick = false; }, 120);
                        return;
                    }

                    if (wasNudging) {
                        const item = cardsData[rowIndex];
                        const v = getView();
                        v.tx = 0;
                        v.ty = 0;

                        if (item && originQuad) {
                            const rect = boxEl.getBoundingClientRect();
                            const gentleScale = 0.18;
                            const normShiftX = -(deltaPxX / Math.max(1, rect.width)) * gentleScale;
                            const normShiftY = -(deltaPxY / Math.max(1, rect.height)) * gentleScale;
                            const shiftedQuad = shiftQuadClamped(originQuad, normShiftX, normShiftY);

                            if (side === 'front') {
                                item.frontQuad = shiftedQuad;
                                item.frontIsCropped = !isFullQuad(shiftedQuad);
                            } else {
                                item.backQuad = shiftedQuad;
                                item.backIsCropped = !isFullQuad(shiftedQuad);
                            }

                            recomputeCroppedImage(item, side, (newUrl) => {
                                const imgEl = boxEl.querySelector('img');
                                if (imgEl) {
                                    imgEl.src = newUrl;
                                    imgEl.style.transform = `translate(0px, 0px) scale(${v.scale})`;
                                }
                            });
                        } else {
                            applyTransformToImg(v);
                            saveToStorage();
                        }
                        setTimeout(() => { suppressNextClick = false; }, 140);
                        return;
                    }

                    if (wasDragging) {
                        setTimeout(() => { suppressNextClick = false; }, 120);
                    }
                }

                if (slotGesture && slotGesture.rowIndex === rowIndex && slotGesture.side === side) {
                    const v = getView();
                    if (v.scale < 1) {
                        v.scale = 1;
                        v.tx = 0;
                        v.ty = 0;
                        applyTransformToImg(v);
                    }
                    boxEl.classList.remove('pinching-active');
                    boxEl.classList.remove('nudging-active');
                    slotGesture = null;
                    saveToStorage();
                }
            };

            boxEl.addEventListener('touchend', finishGesture);
            boxEl.addEventListener('touchcancel', finishGesture);
        }

        function handleDragStart(e, rowIndex, side) {
            e.dataTransfer.setData('text/plain', JSON.stringify({ rowIndex, side }));
        }

        function handleDragOver(e) {
            e.preventDefault();
            const box = e.currentTarget;
            if (box && box.classList.contains('id-box')) {
                box.classList.add('drag-target-over');
            }
        }

        function handleDragLeave(e) {
            const box = e.currentTarget;
            if (box && box.classList.contains('id-box')) {
                box.classList.remove('drag-target-over');
            }
        }

        function handleDrop(e, targetRowIndex, targetSide) {
            e.preventDefault();
            const box = e.currentTarget;
            if (box && box.classList.contains('id-box')) {
                box.classList.remove('drag-target-over');
            }
            const dataStr = e.dataTransfer.getData('text/plain');
            if (!dataStr) return;
            const src = JSON.parse(dataStr);
            moveOrSwapSlots(src.rowIndex, src.side, targetRowIndex, targetSide);
        }

        function renderSheets() {
            const container = document.getElementById('sheetsContainer');
            const clearSection = document.getElementById('clearSection');
            container.innerHTML = '';
            clearSection.innerHTML = '';

            const totalSheets = Math.max(1, Math.ceil(cardsData.filter(i => i.frontCropped || i.backCropped).length / 5) + 1);

            for (let s = 0; s < totalSheets; s++) {
                const slice = cardsData.slice(s * 5, (s + 1) * 5);
                if (s > 0 && slice.every(i => !i.frontCropped && !i.backCropped)) continue;

                const wrapper = document.createElement('div');
                wrapper.className = 'page-wrapper';

                const toolbar = document.createElement('div');
                toolbar.className = 'page-toolbar';
                toolbar.innerHTML = `
                    <span>ورقة طباعة (${s + 1}) - A4</span>
                    <div class="toolbar-btns">
                        <button class="tool-btn btn-save" onclick="exportSheet('sheet-${s}', ${s + 1}, false)">💾 حفظ صورة</button>
                        <button class="tool-btn btn-wa" onclick="exportSheet('sheet-${s}', ${s + 1}, true)">📲 مشاركة واتس</button>
                        <button class="tool-btn btn-pdf" onclick="window.print()">🖨️ طباعة PDF</button>
                    </div>
                `;

                const sheet = document.createElement('div');
                sheet.className = 'a4-sheet';
                sheet.id = `sheet-${s}`;

                for (let r = 0; r < 5; r++) {
                    const pair = slice[r] || createEmptyRow();
                    const globalIdx = (s * 5) + r;

                    const row = document.createElement('div');
                    row.className = 'id-pair-row';

                    const frontBox = document.createElement('div');
                    frontBox.className = 'id-box' + (pair.frontCropped ? ' has-img' : '');
                    frontBox.dataset.rowIndex = String(globalIdx);
                    frontBox.dataset.side = 'front';
                    frontBox.ondragover = handleDragOver;
                    frontBox.ondragleave = handleDragLeave;
                    frontBox.ondrop = (e) => handleDrop(e, globalIdx, 'front');

                    if (pair.frontCropped) {
                        frontBox.draggable = true;
                        frontBox.ondragstart = (e) => handleDragStart(e, globalIdx, 'front');
                        const fv = pair.frontView || { scale: 1, tx: 0, ty: 0 };
                        frontBox.innerHTML = `
                            <div class="slot-stage">
                                <img src="${pair.frontCropped}" style="transform: translate(${fv.tx}px, ${fv.ty}px) scale(${fv.scale})">
                            </div>
                            <button class="box-btn-del" onclick="deleteSingleImage(${globalIdx}, 'front', event)" title="حذف">✕</button>
                            <button class="box-btn-replace" onclick="triggerReplaceImage(${globalIdx}, 'front', event)" title="استبدال">+</button>
                        `;
                    } else {
                        frontBox.innerHTML = `<span>وش البطاقة</span>`;
                    }
                    frontBox.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        handleSlotTapInteraction(globalIdx, 'front', e);
                    };
                    attachTwoFingerAndTouchDrag(frontBox, globalIdx, 'front');

                    const backBox = document.createElement('div');
                    backBox.className = 'id-box' + (pair.backCropped ? ' has-img' : '');
                    backBox.dataset.rowIndex = String(globalIdx);
                    backBox.dataset.side = 'back';
                    backBox.ondragover = handleDragOver;
                    backBox.ondragleave = handleDragLeave;
                    backBox.ondrop = (e) => handleDrop(e, globalIdx, 'back');

                    if (pair.backCropped) {
                        backBox.draggable = true;
                        backBox.ondragstart = (e) => handleDragStart(e, globalIdx, 'back');
                        const bv = pair.backView || { scale: 1, tx: 0, ty: 0 };
                        backBox.innerHTML = `
                            <div class="slot-stage">
                                <img src="${pair.backCropped}" style="transform: translate(${bv.tx}px, ${bv.ty}px) scale(${bv.scale})">
                            </div>
                            <button class="box-btn-del" onclick="deleteSingleImage(${globalIdx}, 'back', event)" title="حذف">✕</button>
                            <button class="box-btn-replace" onclick="triggerReplaceImage(${globalIdx}, 'back', event)" title="استبدال">+</button>
                        `;
                    } else {
                        backBox.innerHTML = `<span>ظهر البطاقة</span>`;
                    }
                    backBox.onclick = (e) => {
                        if (e.target.closest('button')) return;
                        handleSlotTapInteraction(globalIdx, 'back', e);
                    };
                    attachTwoFingerAndTouchDrag(backBox, globalIdx, 'back');

                    row.appendChild(frontBox);
                    row.appendChild(backBox);
                    sheet.appendChild(row);
                }

                wrapper.appendChild(toolbar);
                wrapper.appendChild(sheet);
                container.appendChild(wrapper);
            }

            updateMoveModeUI();
            updatePasteButtonState();

            if (cardsData.some(i => i.frontCropped || i.backCropped)) {
                clearSection.innerHTML = `<button class="btn-clear-all" onclick="clearAllData()">🗑️ مسح الكل والبدء من جديد</button>`;
            }
        }

        async function exportSheet(sheetId, pageNum, shareWA) {
            const el = document.getElementById(sheetId);
            const dels = el.querySelectorAll('.box-btn-del');
            const reps = el.querySelectorAll('.box-btn-replace');
            dels.forEach(d => d.style.display = 'none');
            reps.forEach(re => re.style.display = 'none');

            try {
                const canvas = await html2canvas(el, { scale: 3, backgroundColor: '#ffffff', useCORS: true });
                canvas.toBlob(async function(blob) {
                    const file = new File([blob], `بطاقات_ورقة_${pageNum}.jpg`, { type: 'image/jpeg' });
                    if (shareWA && navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: `ورقة طباعة ${pageNum}` });
                    } else {
                        const link = document.createElement('a');
                        link.download = file.name;
                        link.href = URL.createObjectURL(blob);
                        link.click();
                    }
                }, 'image/jpeg', 0.96);
            } catch (err) {
                alert('حدث خطأ أثناء التصدير.');
            } finally {
                dels.forEach(d => d.style.display = 'flex');
                reps.forEach(re => re.style.display = 'flex');
            }
        }
    </script>
</body>
</html>
